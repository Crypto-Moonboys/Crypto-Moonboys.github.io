<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAXONEDGE - visual WAX token bubble scanner powered by indexed Cloudflare Worker and D1 data.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="WAXONEDGE - WAX Bubble Scanner | Crypto Moonboys">
  <meta property="og:description" content="Scan WAX token bubbles, indexed liquidity, volume, and source coverage from the WaxOnEdge backend.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cryptomoonboys.com/waxonedge.html">
  <meta property="og:image" content="https://cryptomoonboys.com/img/CRYPTO-MOONBOYS-BITCOIN-LOGO.png">
  <link rel="canonical" href="https://cryptomoonboys.com/waxonedge.html">
  <title>WAXONEDGE - WAX Bubble Scanner | Crypto Moonboys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/css/wiki.css">
  <link rel="stylesheet" href="/css/retro-16bit-theme.css">
  <link rel="stylesheet" href="/css/waxonedge.css">
  <link rel="stylesheet" href="/css/waxonedge-bubbles-v2.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body class="page-waxonedge page-standard-shell woe-wide-mode woe-scanner-page woe-antbubbles-page">

<main id="content" role="main">
  <div class="woe-page woe-ab-shell" id="woe-home">
    <header class="woe-og-bar woe-terminal-header woe-ab-topbar">
      <a class="woe-og-brand" href="/waxonedge.html" aria-label="WaxOnEdge scanner home">
        <span class="woe-og-brand-mark woe-ab-brand-mark" aria-hidden="true">●</span>
        <div>
          <h1 class="woe-page-title">WAX<span>ONEDGE</span></h1>
          <p class="woe-page-subtitle">Powered by WaxOnEdge multi-DEX indexer</p>
        </div>
      </a>
      <div class="woe-ab-chain-badge">WAX</div>
      <nav class="woe-ab-segments" aria-label="Bubble metric">
        <button class="is-active" type="button" data-woe-metric="change">% Change</button>
        <button type="button" data-woe-metric="price">Price</button>
        <button type="button" data-woe-metric="volume">Volume</button>
        <button type="button" data-woe-metric="tvl">TVL</button>
        <button type="button" data-woe-metric="mcap">Mkt Cap</button>
      </nav>
      <nav class="woe-ab-segments woe-ab-timeframes" aria-label="Bubble timeframe">
        <button class="is-active" type="button" data-woe-timeframe="24h">24h</button>
        <button type="button" data-woe-timeframe="7d">7D</button>
        <button type="button" data-woe-timeframe="30d">30D</button>
      </nav>
      <div class="woe-ab-search">
        <input id="woe-global-search" type="search" placeholder="Search symbol, contract, source..." autocomplete="off" aria-label="Search WaxOnEdge bubbles">
      </div>
      <div class="woe-ab-live">
        <span id="woe-ab-live-dot" class="woe-ab-live-dot is-waiting"></span>
        <span id="woe-ab-live-text">CONNECTING</span>
      </div>
      <div id="woe-ab-last-updated" class="woe-ab-updated">Waiting for sync</div>
      <div class="woe-og-wax-block">
        <span class="woe-og-block-label">WAX Price</span>
        <strong id="woe-topbar-wax-price">$ --</strong>
        <span id="woe-topbar-wax-price-meta">Waiting for live data...</span>
      </div>
    </header>

    <section class="woe-section woe-bubble-section woe-scanner-only woe-ab-board-section" aria-labelledby="woe-bubbles-heading">
      <h2 id="woe-bubbles-heading" class="woe-ab-sr">WaxOnEdge AntBubbles-style scanner</h2>
      <div id="woe-bubble-board" class="woe-bubble-board" aria-live="polite">
        <p class="woe-loading">Loading token bubbles...</p>
      </div>
      <footer id="woe-ab-stats" class="woe-ab-stats" aria-live="polite"></footer>
    </section>
  </div>
</main>
<div id="woe-ab-modal" class="woe-ab-modal" hidden></div>

<script data-cfasync="false" src="/js/api-config.js"></script>
<script data-cfasync="false" src="/js/arcade/core/global-event-bus.js"></script>
<script data-cfasync="false" src="/js/identity-gate.js"></script>
<script data-cfasync="false" src="/js/core/moonboys-state.js"></script>
<script data-cfasync="false" src="/js/site-shell.js"></script>
<script data-cfasync="false" src="/js/components/connection-status-panel.js"></script>
<script data-cfasync="false" src="/js/components/global-player-header.js"></script>
<script data-cfasync="false" src="/js/components/live-activity-summary.js"></script>
<script data-cfasync="false" src="/js/waxonedge-bubbles-v2.js"></script>

</body>
</html>
