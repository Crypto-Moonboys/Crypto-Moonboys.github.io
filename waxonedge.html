<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAXONEDGE - visual WAX token bubble scanner powered by indexed Cloudflare Worker and D1 data.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="WAXONEDGE - WAX Bubble Scanner | Crypto Moonboys">
  <meta property="og:description" content="Scan WAX token bubbles, indexed liquidity, volume, and source coverage from the WaxOnEdge backend.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cryptomoonboys.com/waxonedge.html">
  <meta property="og:image" content="https://cryptomoonboys.com/img/CRYPTO-MOONBOYS-BITCOIN-LOGO.png">
  <link rel="canonical" href="https://cryptomoonboys.com/waxonedge.html">
  <title>WAXONEDGE - WAX Bubble Scanner | Crypto Moonboys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/css/wiki.css">
  <link rel="stylesheet" href="/css/retro-16bit-theme.css">
  <link rel="stylesheet" href="/css/waxonedge.css">
  <link rel="stylesheet" href="/css/waxonedge-bubbles-v2.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body class="page-waxonedge page-standard-shell woe-wide-mode woe-scanner-page">

<main id="content" role="main">
  <div class="woe-page" id="woe-home">
    <header class="woe-og-bar woe-terminal-header">
      <a class="woe-og-brand" href="/waxonedge.html" aria-label="WaxOnEdge scanner home">
        <span class="woe-og-brand-mark" aria-hidden="true">WE</span>
        <div>
          <h1 class="woe-page-title">WAXONEDGE</h1>
          <p class="woe-page-subtitle">WAX bubble scanner</p>
        </div>
      </a>
      <div class="woe-og-wax-block">
        <span class="woe-og-block-label">WAX Price</span>
        <strong id="woe-topbar-wax-price">$ --</strong>
        <span id="woe-topbar-wax-price-meta">Waiting for live data...</span>
      </div>
    </header>

    <section class="woe-section woe-bubble-section woe-scanner-only" aria-labelledby="woe-bubbles-heading">
      <div class="woe-scanner-heading">
        <span class="woe-kicker">Indexed Cloudflare/D1 feed</span>
        <h2 id="woe-bubbles-heading">Bubble Token Scanner</h2>
      </div>
      <div class="woe-toolbar" id="woe-scanner-controls">
        <div class="woe-search-group">
          <label for="woe-global-search">Search</label>
          <input id="woe-global-search" class="woe-search-input" type="search" placeholder="Filter symbols, contracts, sources..." autocomplete="off" aria-label="Filter token bubbles">
        </div>
        <div class="woe-search-group">
          <label for="woe-bubble-metric">Bubble Size</label>
          <select id="woe-bubble-metric" class="woe-select" aria-label="Bubble size metric">
            <option value="liquidity">Liquidity / TVL</option>
            <option value="volume">24h Volume</option>
            <option value="pairs">Pair Count</option>
          </select>
        </div>
        <div class="woe-search-group">
          <label for="woe-source-filter">Source</label>
          <select id="woe-source-filter" class="woe-select" aria-label="Filter by indexed source">
            <option value="">All Sources</option>
            <option value="alcor">alcor</option>
            <option value="swap.alcor">swap.alcor</option>
            <option value="swap.taco">swap.taco</option>
            <option value="swap.nefty">swap.nefty</option>
            <option value="swap.box">swap.box</option>
          </select>
        </div>
      </div>
      <div id="woe-bubble-board" class="woe-bubble-board" aria-live="polite">
        <p class="woe-loading">Loading token bubbles...</p>
      </div>
    </section>
  </div>
</main>

<script data-cfasync="false" src="/js/api-config.js"></script>
<script data-cfasync="false" src="/js/arcade/core/global-event-bus.js"></script>
<script data-cfasync="false" src="/js/identity-gate.js"></script>
<script data-cfasync="false" src="/js/core/moonboys-state.js"></script>
<script data-cfasync="false" src="/js/site-shell.js"></script>
<script data-cfasync="false" src="/js/components/connection-status-panel.js"></script>
<script data-cfasync="false" src="/js/components/global-player-header.js"></script>
<script data-cfasync="false" src="/js/components/live-activity-summary.js"></script>
<script data-cfasync="false" src="/js/waxonedge-sources.js"></script>
<script data-cfasync="false" src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script data-cfasync="false" src="/js/waxonedge.js"></script>
<script data-cfasync="false" src="/js/waxonedge-bubbles-v2.js"></script>

</body>
</html>
