<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06110b">
  <meta name="robots" content="noindex,nofollow">
  <title>Moonpet OS</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/moonpet-mini-app.css?v=20260820-journey-reward-ux">
  <style>
    .terminal-shell::after {
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.06) 50%), linear-gradient(90deg, rgba(255,0,0,.01), rgba(0,255,0,.006), rgba(0,0,255,.01));
      opacity: .5;
    }
    #moonpet-canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    .terminal-output {
      min-height: 52px; max-height: 76px; overflow: auto;
      white-space: normal; overflow-wrap: anywhere; text-overflow: clip;
    }
    @media (max-height: 620px) {
      .terminal-output { min-height: 46px; max-height: 70px; }
    }
  </style>
</head>
<body class="page-standalone-tool">
  <main id="moonpet-app" class="terminal-shell">
    <header class="system-bar">
      <span id="system-title"></span>
      <span id="system-clock"></span>
    </header>
    <section class="viewport">
      <canvas id="moonpet-canvas" width="640" height="440" tabindex="0" role="button" aria-label="Interact with your animated Moonpet"></canvas>
      <div id="hud" class="hud"></div>
      <div id="boot-layer" class="boot-layer"><pre id="boot-text"></pre><span class="cursor" aria-hidden="true"></span></div>
    </section>
    <section id="terminal-output" class="terminal-output" aria-live="assertive"></section>
    <section id="screen" class="screen" aria-label="Game controls"></section>
    <nav id="nav" class="dock" aria-label="Moonpet sections"></nav>
    <section id="utility-layer" class="utility-layer" role="dialog" aria-modal="true" aria-labelledby="utility-title" hidden>
      <div class="utility-dialog">
        <header class="utility-dialog-header">
          <h2 id="utility-title">MOONPET OS</h2>
          <button type="button" class="utility-close" data-utility-close aria-label="Close">CLOSE ×</button>
        </header>
        <div id="utility-content" class="utility-content"></div>
      </div>
    </section>
  </main>
  <noscript>This game requires JavaScript.</noscript>
  <script data-cfasync="false" src="https://telegram.org/js/telegram-web-app.js"></script>
  <script data-cfasync="false" src="/js/api-config.js?v=20260813-first-party-api"></script>
  <script data-cfasync="false" src="/js/identity-gate.js"></script>
  <script data-cfasync="false" src="/js/moonpet-canvas-readability-shim.js?v=20260813-canvas-readability-shim"></script>
  <script data-cfasync="false" src="/js/moonpet-mini-app.js?v=20260820-journey-reward-ux"></script>
</body>
</html>
