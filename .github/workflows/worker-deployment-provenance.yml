name: Worker Deployment Provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-deployment-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify safe static PR changes
        id: fast_edit
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # Trust the protected base revision, never a contributor-modified PR file.
          if git cat-file -e "$BASE_SHA:scripts/fast-edit-scope.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/fast-edit-scope.mjs" > "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
            node "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
          else
            echo "fast_edit=false" >> "$GITHUB_OUTPUT"
            echo "No trusted classifier in base: performing complete deployment audit."
          fi

      - name: Fast Edit acknowledged
        if: steps.fast_edit.outputs.fast_edit == 'true'
        run: |
          echo "Static-only PR; unchanged deployment contract"

      - name: Install audit dependencies
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test Worker provenance contract
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/worker-deployment-provenance.test.mjs

      - name: Test Worker deploy invocation contract
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/worker-deployment-windows.test.mjs

      - name: Audit Worker deploy readiness
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/worker-deploy-readiness-audit.mjs

      - name: Test webhook authentication and required production configuration
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: |
          node scripts/telegram-webhook-auth.test.mjs
          node scripts/telegram-webhook-deployment.test.mjs

      - name: Audit production truth claims
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/production-deployment-truth-audit.mjs

  verify-windows-command-line:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify safe static PR changes
        id: fast_edit
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # Trust the protected base revision, never a contributor-modified PR file.
          if git cat-file -e "$BASE_SHA:scripts/fast-edit-scope.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/fast-edit-scope.mjs" > "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
            node "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
          else
            echo "fast_edit=false" >> "$GITHUB_OUTPUT"
            echo "No trusted classifier in base: performing complete deployment audit."
          fi

      - name: Fast Edit acknowledged
        if: steps.fast_edit.outputs.fast_edit == 'true'
        run: |
          echo "Static-only PR; unchanged deployment contract"

      - name: Execute Windows cmd.exe quoting regression
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/worker-deployment-windows.test.mjs
