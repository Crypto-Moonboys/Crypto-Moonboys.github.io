name: Temporary SPARKY Publishing Sync

on:
  push:
    branches:
      - feature/sparky-complete-creator-studio-20261010
    paths:
      - '.github/workflows/sparky-publishing-sync-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Crypto-Moonboys/Crypto-Moonboys.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Regenerate and commit public publishing surfaces
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node scripts/wiki-publish-gate.js
          node scripts/generate-publishing-surfaces.mjs
          git add -- js/wiki-publish-audit.json js/wiki-index.json js/link-map.json js/link-graph.json js/entity-map.json js/entity-graph.json js/graph-data.json js/entity-graph-lite.json js/site-stats.json sitemap.xml index_stats.json sam-memory.json
          if git diff --cached --quiet; then
            echo "No publishing changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate SPARKY Moonboy wiki search, graph and sitemap outputs"
          git push origin HEAD:feature/sparky-complete-creator-studio-20261010
