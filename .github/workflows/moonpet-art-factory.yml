name: Moonpet Art Factory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moonpet-art-factory.yml"
      - "scripts/discover-autosprite-character.js"
      - "scripts/generate-botty-front-animations.js"
      - "scripts/download-botty-front-animations.js"
      - "scripts/generate-moonpet-front-action-pack.js"
      - "scripts/audit-moonpet-front-action-pack.js"
      - "scripts/promote-moonpet-bot-front-pack.js"
      - "scripts/audit-eggyone-stage0-art.js"
      - "scripts/inspect-autosprite-stage0-pack.js"
      - "scripts/download-eggyone-stage0-animations.js"
      - "data/moonpet-art-factory-request.json"
  workflow_dispatch:
    inputs:
      phase:
        description: "Current AutoSprite front-pack operation."
        required: true
        default: "download-existing-front-pack"
        type: choice
        options:
          - discover-autosprite-character
          - generate-front-pack
          - generate-front-action-pack
          - download-existing-front-pack
          - install-existing-street-pack
          - inspect-existing-stage0-pack
          - download-existing-stage0-pack
      autosprite_character_name:
        description: "Exact existing AutoSprite character name."
        required: true
        default: "BOTTY"
      execute_front_generation:
        description: "Actually call AutoSprite when phase=generate-front-pack."
        required: true
        default: false
        type: boolean
      auto_commit_autosprite_character_registry:
        description: "Commit the non-secret AutoSprite character registry after discovery."
        required: true
        default: true
        type: boolean
      front_action_regenerate:
        description: "Comma-separated CHARACTER:role targets rejected during visual review."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  moonpet-art-factory:
    runs-on: ubuntu-latest
    env:
      AUTOSPRITE_API_KEY: ${{ secrets.AUTOSPRITE_API_KEY }}
      FACTORY_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.phase || 'download-existing-front-pack' }}
      AUTOSPRITE_CHARACTER_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.autosprite_character_name || 'BOTTY' }}
      EXECUTE_FRONT_GENERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_front_generation || false }}
      AUTO_COMMIT_AUTOSPRITE_CHARACTER_REGISTRY: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_commit_autosprite_character_registry }}
      FRONT_ACTION_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.front_action_regenerate || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve push-triggered request
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          FACTORY_PHASE="$(node -p 'require("./data/moonpet-art-factory-request.json").phase')"
          AUTOSPRITE_CHARACTER_NAME="$(node -p 'require("./data/moonpet-art-factory-request.json").autosprite_character_name')"
          echo "FACTORY_PHASE=$FACTORY_PHASE" >> "$GITHUB_ENV"
          echo "AUTOSPRITE_CHARACTER_NAME=$AUTOSPRITE_CHARACTER_NAME" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate current Moonpet art pipeline
        run: |
          node --check scripts/generate-moonpet-assets.js
          node --check scripts/discover-autosprite-character.js
          node --check scripts/generate-botty-front-animations.js
          node --check scripts/download-botty-front-animations.js
          node --check scripts/generate-moonpet-front-action-pack.js
          node --check scripts/audit-moonpet-front-action-pack.js
          node --check scripts/promote-moonpet-bot-front-pack.js
          node --check scripts/audit-eggyone-stage0-art.js
          node --check scripts/inspect-autosprite-stage0-pack.js
          node --check scripts/download-eggyone-stage0-animations.js
          node scripts/generate-moonpet-assets-extraction.test.js
          node scripts/audit-eggyone-stage0-art.js --check
          node scripts/moonpet-art-architecture.test.mjs
          node scripts/moonpet-multi-bot-art.test.mjs

      - name: Discover AutoSprite character
        if: ${{ env.FACTORY_PHASE == 'discover-autosprite-character' || env.FACTORY_PHASE == 'generate-front-pack' || env.FACTORY_PHASE == 'generate-front-action-pack' || env.FACTORY_PHASE == 'download-existing-front-pack' || env.FACTORY_PHASE == 'install-existing-street-pack' || env.FACTORY_PHASE == 'inspect-existing-stage0-pack' || env.FACTORY_PHASE == 'download-existing-stage0-pack' }}
        timeout-minutes: 10
        run: node scripts/discover-autosprite-character.js --name "$AUTOSPRITE_CHARACTER_NAME" --persist

      - name: Generate front-facing animation pack
        if: ${{ env.FACTORY_PHASE == 'generate-front-pack' }}
        timeout-minutes: 240
        shell: bash
        run: |
          ARGS=(--character-name "$AUTOSPRITE_CHARACTER_NAME")
          if [ "$EXECUTE_FRONT_GENERATION" = "true" ]; then ARGS+=(--execute); else ARGS+=(--dry-run); fi
          node scripts/generate-botty-front-animations.js "${ARGS[@]}"

      - name: Download existing front-facing pack
        if: ${{ env.FACTORY_PHASE == 'download-existing-front-pack' || env.FACTORY_PHASE == 'install-existing-street-pack' }}
        timeout-minutes: 30
        run: node scripts/download-botty-front-animations.js --character-name "$AUTOSPRITE_CHARACTER_NAME"

      - name: Generate and install ten-character front action pack
        if: ${{ env.FACTORY_PHASE == 'generate-front-action-pack' && env.EXECUTE_FRONT_GENERATION == 'true' }}
        timeout-minutes: 360
        shell: bash
        run: |
          ARGS=()
          if [ -n "$FRONT_ACTION_REGENERATE" ]; then ARGS+=(--regenerate "$FRONT_ACTION_REGENERATE"); fi
          node scripts/generate-moonpet-front-action-pack.js "${ARGS[@]}"

      - name: Validate ten-character front action pack
        if: ${{ env.FACTORY_PHASE == 'generate-front-action-pack' && env.EXECUTE_FRONT_GENERATION == 'true' }}
        run: |
          node scripts/audit-moonpet-front-action-pack.js --write
          node scripts/audit-eggyone-stage0-art.js --check
          node scripts/moonpet-art-architecture.test.mjs
          node scripts/moonpet-multi-bot-art.test.mjs

      - name: Audit approved EGGYONE Stage-0 art
        if: ${{ env.FACTORY_PHASE == 'install-existing-street-pack' }}
        timeout-minutes: 10
        run: node scripts/audit-eggyone-stage0-art.js --write

      - name: Inspect existing Stage-0 pack
        if: ${{ env.FACTORY_PHASE == 'inspect-existing-stage0-pack' }}
        timeout-minutes: 30
        run: node scripts/inspect-autosprite-stage0-pack.js --character-name "$AUTOSPRITE_CHARACTER_NAME"

      - name: Download existing EGGYONE Stage-0 pack
        if: ${{ env.FACTORY_PHASE == 'download-existing-stage0-pack' }}
        timeout-minutes: 30
        run: node scripts/download-eggyone-stage0-animations.js --character-name "$AUTOSPRITE_CHARACTER_NAME"

      - name: Promote shared Street-stage pack
        if: ${{ env.FACTORY_PHASE == 'install-existing-street-pack' }}
        run: >-
          node scripts/promote-moonpet-bot-front-pack.js
          --manifest "output/manifests/wtfboi-front-existing-sheets.generated.json"
          --source-root .
          --shared-stage stage_1
          --artifact-run "${{ github.run_id }}"
          --approve-visual-review

      - name: Validate promoted Street-stage pack
        if: ${{ env.FACTORY_PHASE == 'install-existing-street-pack' }}
        run: |
          node scripts/moonpet-art-architecture.test.mjs
          node scripts/moonpet-multi-bot-art.test.mjs

      - name: Commit AutoSprite character registry
        if: ${{ env.AUTO_COMMIT_AUTOSPRITE_CHARACTER_REGISTRY == 'true' && (success() || env.FACTORY_PHASE != 'generate-front-action-pack') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moonpet-autosprite-characters.json
          if [ -d data/autosprite-generation-diagnostics ]; then git add data/autosprite-generation-diagnostics/; fi
          if [ "$FACTORY_PHASE" = "install-existing-street-pack" ]; then
            git add data/moonpet-bot-art-registry.json data/moonpet-art-requirements.json data/moonpet-eggyone-stage0-audit.json
            git add data/moonpet-wtfboi-front-assets.json img/moonpets/wtfboi/
            COMMIT_MESSAGE="feat: install WTFBOI shared Street-stage art"
          elif [ "$FACTORY_PHASE" = "generate-front-action-pack" ]; then
            git add data/moonpet-bot-art-registry.json data/moonpet-front-action-generation.json data/moonpet-front-action-audit.json
            git add data/moonpet-*-front-assets.json data/moonpet-eggyone-stage0-assets.json
            git add img/moonpets/*/front_dance.png img/moonpets/*/front_dance.json
            git add img/moonpets/*/front_victory.png img/moonpets/*/front_victory.json
            git add img/moonpets/*/front_fight.png img/moonpets/*/front_fight.json
            git add img/moonpets/*/front-actions-contact-sheet.png
            COMMIT_MESSAGE="feat: add Moonpet front action sprite pack"
          elif [ "$FACTORY_PHASE" = "download-existing-stage0-pack" ]; then
            git add data/moonpet-eggyone-stage0-assets.json img/moonpets/eggyone/
            COMMIT_MESSAGE="chore: stage existing EGGYONE art for visual review"
          else
            COMMIT_MESSAGE="chore: persist AutoSprite character registry and diagnostics [skip ci]"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MESSAGE"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload current Moonpet art output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonpet-art-factory-${{ env.FACTORY_PHASE }}
          path: |
            output/moonpets/
            output/manifests/
            data/moonpet-autosprite-characters.json
            data/moonpet-wtfboi-front-assets.json
            data/moonpet-eggyone-stage0-assets.json
            data/moonpet-eggyone-stage0-audit.json
            data/moonpet-front-action-generation.json
            data/moonpet-front-action-audit.json
            img/moonpets/wtfboi/contact-sheet.png
            img/moonpets/eggyone/contact-sheet.png
            img/moonpets/*/front-actions-contact-sheet.png
            data/autosprite-generation-diagnostics/
          if-no-files-found: warn
