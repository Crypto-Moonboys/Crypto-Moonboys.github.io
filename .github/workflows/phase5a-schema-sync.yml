name: Phase 5A schema sync

on:
  push:
    branches:
      - agent/pets-runtime-phase-5a

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pets-runtime-phase-5a
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mirror migration 039 into schema.sql
        run: |
          node <<'NODE'
          const fs = require('fs');
          const schemaPath = 'workers/moonboys-api/schema.sql';
          const workflowPath = '.github/workflows/phase5a-schema-sync.yml';
          let schema = fs.readFileSync(schemaPath, 'utf8').replace(/\s*$/, '\n');
          if (!schema.includes('CREATE TABLE IF NOT EXISTS telegram_pet_progression_state')) {
            const migration = fs.readFileSync('workers/moonboys-api/migrations/039_telegram_pet_runtime_progression.sql', 'utf8');
            const definitions = migration.split('\nINSERT OR IGNORE INTO telegram_pet_progression_state')[0].trim();
            schema += `\n-- ── Crypto Moonboy Pets Phase 5A runtime progression ─────────────────────────\n\n${definitions}\n`;
            fs.writeFileSync(schemaPath, schema);
          }
          fs.rmSync(workflowPath);
          NODE
      - name: Commit canonical schema sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/moonboys-api/schema.sql .github/workflows/phase5a-schema-sync.yml
          git commit -m "Mirror Phase 5A tables in canonical schema"
          git push origin HEAD:agent/pets-runtime-phase-5a
