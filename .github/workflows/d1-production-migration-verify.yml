name: D1 Production Migration Verify

on:
  pull_request:
    paths:
      - deployments/d1-evidence-request.json
      - scripts/verify-d1-production-migrations.mjs
      - .github/workflows/d1-production-migration-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify parser syntax
        run: node --check scripts/verify-d1-production-migrations.mjs
      - name: Verify migration evidence contract
        shell: bash
        run: |
          test -f workers/moonboys-api/migrations/038_telegram_pet_equipment_progression.sql
          test -f workers/moonboys-api/migrations/039_telegram_pet_runtime_progression.sql
          printf '%s\n' '[{"success":true,"results":[{"name":"038_telegram_pet_equipment_progression.sql"},{"name":"039_telegram_pet_runtime_progression.sql"}]}]' > /tmp/d1-query.json
          node scripts/verify-d1-production-migrations.mjs --input /tmp/d1-query.json --request deployments/d1-evidence-request.json --output /tmp/d1-evidence.json
          node -e "const e=require('/tmp/d1-evidence.json'); if(e.status!=='verified-applied'||e.verified_migrations.length!==2) process.exit(1)"
      - name: Confirm production claim remains unverified
        run: node -e "const p=require('./deployments/production.json'); if(p.d1_databases.wikicoms.deployment_status!=='unverified'||p.d1_databases.wikicoms.verified_migrations.length!==0) process.exit(1)"

  verify-remote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
