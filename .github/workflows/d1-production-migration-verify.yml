name: D1 Production Migration Verify

on:
  pull_request:
    paths:
      - deployments/d1-evidence-request.json
      - scripts/verify-d1-production-migrations.mjs
      - scripts/verify-d1-production-migrations.test.mjs
      - scripts/report-d1-query-failure.mjs
      - workers/moonboys-api/migrations/041_telegram_pet_repeat_reward_slots.sql
      - workers/moonboys-api/migrations/042_telegram_pet_roguelite_foundation.sql
      - workers/moonboys-api/migrations/043_telegram_pet_identity_expansion.sql
      - workers/moonboys-api/migrations/044_telegram_pet_daily_runs.sql
      - workers/moonboys-api/migrations/045_telegram_pet_inventory_cutover_reconciliation.sql
      - workers/moonboys-api/migrations/046_fix_pet_runtime_unique_constraints.sql
      - workers/moonboys-api/migrations/047_fix_telegram_leaderboard_reward_constraint.sql
      - workers/moonboys-api/migrations/048_telegram_pet_player_expansion.sql
      - workers/moonboys-api/migrations/049_telegram_pet_dialogue_history.sql
      - workers/moonboys-api/migrations/050_telegram_pet_guided_progression.sql
      - workers/moonboys-api/migrations/051_telegram_pet_content_reconciliation.sql
      - workers/moonboys-api/migrations/052_telegram_pet_live_systems.sql
      - workers/moonboys-api/migrations/053_telegram_pet_species_lifecycle.sql
      - workers/moonboys-api/migrations/054_telegram_pet_client_performance.sql
      - workers/moonboys-api/migrations/055_telegram_pet_season_slots.sql
      - workers/moonboys-api/migrations/056_telegram_pet_instance_state.sql
      - workers/moonboys-api/migrations/057_telegram_pet_lifecycle_pet_id.sql
      - workers/moonboys-api/migrations/058_telegram_pet_season_completion.sql
      - workers/moonboys-api/migrations/059_telegram_pet_sanctuary.sql
      - workers/moonboys-api/migrations/060_telegram_pet_sanctuary_indexes.sql
      - workers/moonboys-api/migrations/061_moonpet_season_economy_calibration.sql
      - workers/moonboys-api/migrations/062_moonpet_evolution_stage_5.sql
      - workers/moonboys-api/migrations/063_arcade_xp_spendable_wallet.sql
      - workers/moonboys-api/migrations/064_moonpet_beta_runtime_cutover.sql
      - workers/moonboys-api/migrations/065_moonpet_reward_pet_id_authority.sql
      - workers/moonboys-api/migrations/066_moonpet_run_pet_id_authority.sql
      - workers/moonboys-api/migrations/067_moonpet_daily_journey_authority.sql
      - workers/moonboys-api/migrations/068_moonpet_weekly_journey_authority.sql
      - workers/moonboys-api/migrations/069_moonpet_breeding_authority.sql
      - workers/moonboys-api/migrations/070_moonpet_pet_identity_achievement_authority.sql
      - workers/moonboys-api/migrations/071_moonpet_arena_pet_authority.sql
      - workers/moonboys-api/migrations/072_moonpet_identity_authority_verification.sql
      - .github/workflows/d1-production-migration-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify parser syntax
        run: |
          node --check scripts/verify-d1-production-migrations.mjs
          node --check scripts/verify-d1-production-migrations.test.mjs
          node --check scripts/report-d1-query-failure.mjs
      - name: Verify required migration contract
        run: node scripts/verify-d1-production-migrations.test.mjs
      - name: Verify known migration evidence
        shell: bash
        run: |
          printf '%s\n' '[{"success":true,"results":[{"name":"038_telegram_pet_equipment_progression.sql"},{"name":"039_telegram_pet_runtime_progression.sql"},{"name":"041_telegram_pet_repeat_reward_slots.sql"},{"name":"042_telegram_pet_roguelite_foundation.sql"},{"name":"043_telegram_pet_identity_expansion.sql"},{"name":"044_telegram_pet_daily_runs.sql"},{"name":"045_telegram_pet_inventory_cutover_reconciliation.sql"},{"name":"046_fix_pet_runtime_unique_constraints.sql"},{"name":"047_fix_telegram_leaderboard_reward_constraint.sql"},{"name":"048_telegram_pet_player_expansion.sql"},{"name":"049_telegram_pet_dialogue_history.sql"},{"name":"050_telegram_pet_guided_progression.sql"},{"name":"051_telegram_pet_content_reconciliation.sql"},{"name":"052_telegram_pet_live_systems.sql"},{"name":"053_telegram_pet_species_lifecycle.sql"},{"name":"054_telegram_pet_client_performance.sql"},{"name":"055_telegram_pet_season_slots.sql"},{"name":"056_telegram_pet_instance_state.sql"},{"name":"057_telegram_pet_lifecycle_pet_id.sql"},{"name":"058_telegram_pet_season_completion.sql"},{"name":"059_telegram_pet_sanctuary.sql"},{"name":"060_telegram_pet_sanctuary_indexes.sql"},{"name":"061_moonpet_season_economy_calibration.sql"},{"name":"062_moonpet_evolution_stage_5.sql"},{"name":"063_arcade_xp_spendable_wallet.sql"},{"name":"064_moonpet_beta_runtime_cutover.sql"},{"name":"065_moonpet_reward_pet_id_authority.sql"},{"name":"066_moonpet_run_pet_id_authority.sql"},{"name":"067_moonpet_daily_journey_authority.sql"},{"name":"068_moonpet_weekly_journey_authority.sql"},{"name":"069_moonpet_breeding_authority.sql"},{"name":"070_moonpet_pet_identity_achievement_authority.sql"},{"name":"071_moonpet_arena_pet_authority.sql"},{"name":"072_moonpet_identity_authority_verification.sql"}]}]' > /tmp/d1-query.json
          node scripts/verify-d1-production-migrations.mjs --input /tmp/d1-query.json --request deployments/d1-evidence-request.json --output /tmp/d1-evidence.json
          node -e "const e=require('/tmp/d1-evidence.json'); if(e.status!=='verified-applied') process.exit(1)"
      - name: Verify sanitised failure reporting
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: contract-test-token
          CLOUDFLARE_ACCOUNT_ID: contract-test-account
        run: |
          printf '%s\n' '{"error":{"code":9109,"message":"Authentication failed for contract-test-account"}}' > /tmp/d1-failure.json
          printf '%s\n' 'token contract-test-token rejected' > /tmp/d1-failure.stderr
          node scripts/report-d1-query-failure.mjs /tmp/d1-failure.json /tmp/d1-failure.stderr /tmp/d1-failure.txt 2>/tmp/d1-failure-console.txt
          grep -F 'Authentication failed for [REDACTED]' /tmp/d1-failure.txt
          grep -F 'token [REDACTED] rejected' /tmp/d1-failure.txt
          if grep -F 'contract-test-token' /tmp/d1-failure.txt; then exit 1; fi
          if grep -F 'contract-test-account' /tmp/d1-failure.txt; then exit 1; fi

  verify-remote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN"
            missing=1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi

          [ "$missing" -eq 0 ]
      - name: Query production migration records
        id: d1-query
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "SELECT name FROM d1_migrations WHERE name IN ('038_telegram_pet_equipment_progression.sql', '039_telegram_pet_runtime_progression.sql', '041_telegram_pet_repeat_reward_slots.sql', '042_telegram_pet_roguelite_foundation.sql', '043_telegram_pet_identity_expansion.sql', '044_telegram_pet_daily_runs.sql', '045_telegram_pet_inventory_cutover_reconciliation.sql', '046_fix_pet_runtime_unique_constraints.sql', '047_fix_telegram_leaderboard_reward_constraint.sql', '048_telegram_pet_player_expansion.sql', '049_telegram_pet_dialogue_history.sql', '050_telegram_pet_guided_progression.sql', '051_telegram_pet_content_reconciliation.sql', '052_telegram_pet_live_systems.sql', '053_telegram_pet_species_lifecycle.sql', '054_telegram_pet_client_performance.sql', '055_telegram_pet_season_slots.sql', '056_telegram_pet_instance_state.sql', '057_telegram_pet_lifecycle_pet_id.sql', '058_telegram_pet_season_completion.sql', '059_telegram_pet_sanctuary.sql', '060_telegram_pet_sanctuary_indexes.sql', '061_moonpet_season_economy_calibration.sql', '062_moonpet_evolution_stage_5.sql', '063_arcade_xp_spendable_wallet.sql', '064_moonpet_beta_runtime_cutover.sql', '065_moonpet_reward_pet_id_authority.sql', '066_moonpet_run_pet_id_authority.sql', '067_moonpet_daily_journey_authority.sql', '068_moonpet_weekly_journey_authority.sql', '069_moonpet_breeding_authority.sql', '070_moonpet_pet_identity_achievement_authority.sql', '071_moonpet_arena_pet_authority.sql', '072_moonpet_identity_authority_verification.sql') ORDER BY name" \
            --json > d1-migration-query.json 2> d1-migration-query.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Report sanitised query failure
        if: steps.d1-query.outputs.status != '0'
        shell: bash
        run: |
          node scripts/report-d1-query-failure.mjs \
            d1-migration-query.json \
            d1-migration-query.stderr \
            d1-query-failure.txt
          exit "${{ steps.d1-query.outputs.status }}"
      - name: Upload sanitised failure diagnostics
        if: always() && steps.d1-query.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: d1-query-failure-diagnostics
          path: d1-query-failure.txt
          if-no-files-found: error
          retention-days: 30
      - name: Validate and sanitise evidence
        if: steps.d1-query.outputs.status == '0'
        run: node scripts/verify-d1-production-migrations.mjs --input d1-migration-query.json --request deployments/d1-evidence-request.json --output d1-production-migration-evidence.json
      - name: Query production identity authority violations
        if: steps.d1-query.outputs.status == '0'
        id: d1-identity-audit
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "SELECT COUNT(*) AS invalid_identity_authority_rows FROM moonpet_invalid_identity_authority_rows" \
            --json > d1-identity-authority-audit.json 2> d1-identity-authority-audit.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Fail on production identity authority violations
        if: steps.d1-query.outputs.status == '0'
        shell: bash
        run: |
          if [ "${{ steps.d1-identity-audit.outputs.status }}" != "0" ]; then
            node scripts/report-d1-query-failure.mjs \
              d1-identity-authority-audit.json \
              d1-identity-authority-audit.stderr \
              d1-identity-authority-audit-failure.txt
            exit "${{ steps.d1-identity-audit.outputs.status }}"
          fi
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('d1-identity-authority-audit.json','utf8')); const rows=Array.isArray(payload) ? (payload[0]?.results || []) : (payload.results || []); const count=Number(rows[0]?.invalid_identity_authority_rows ?? rows[0]?.count ?? NaN); if(count !== 0){ console.error('Expected 0 invalid identity authority rows, got '+count); process.exit(1); } console.log('0 invalid identity authority rows');"
      - name: Upload sanitised evidence
        if: steps.d1-query.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: d1-production-migration-evidence
          path: |
            d1-production-migration-evidence.json
            d1-identity-authority-audit.json
          if-no-files-found: error
          retention-days: 90
