name: D1 Production Migration Verify

on:
  pull_request:
    paths:
      - deployments/d1-evidence-request.json
      - scripts/verify-d1-production-migrations.mjs
      - scripts/verify-d1-production-migrations.test.mjs
      - scripts/verify-d1-identity-authority-audit.mjs
      - scripts/verify-d1-moonpet-hardening-audit.mjs
      - scripts/verify-d1-moonpet-hardening-audit.test.mjs
      - scripts/report-d1-query-failure.mjs
      - workers/moonboys-api/migrations/038_telegram_pet_equipment_progression.sql
      - workers/moonboys-api/migrations/039_telegram_pet_runtime_progression.sql
      - workers/moonboys-api/migrations/041_telegram_pet_repeat_reward_slots.sql
      - workers/moonboys-api/migrations/042_telegram_pet_roguelite_foundation.sql
      - workers/moonboys-api/migrations/043_telegram_pet_identity_expansion.sql
      - workers/moonboys-api/migrations/044_telegram_pet_daily_runs.sql
      - workers/moonboys-api/migrations/045_telegram_pet_inventory_cutover_reconciliation.sql
      - workers/moonboys-api/migrations/046_fix_pet_runtime_unique_constraints.sql
      - workers/moonboys-api/migrations/047_fix_telegram_leaderboard_reward_constraint.sql
      - workers/moonboys-api/migrations/048_telegram_pet_player_expansion.sql
      - workers/moonboys-api/migrations/049_telegram_pet_dialogue_history.sql
      - workers/moonboys-api/migrations/050_telegram_pet_guided_progression.sql
      - workers/moonboys-api/migrations/051_telegram_pet_content_reconciliation.sql
      - workers/moonboys-api/migrations/052_telegram_pet_live_systems.sql
      - workers/moonboys-api/migrations/053_telegram_pet_species_lifecycle.sql
      - workers/moonboys-api/migrations/054_telegram_pet_client_performance.sql
      - workers/moonboys-api/migrations/055_telegram_pet_season_slots.sql
      - workers/moonboys-api/migrations/056_telegram_pet_instance_state.sql
      - workers/moonboys-api/migrations/057_telegram_pet_lifecycle_pet_id.sql
      - workers/moonboys-api/migrations/058_telegram_pet_season_completion.sql
      - workers/moonboys-api/migrations/059_telegram_pet_sanctuary.sql
      - workers/moonboys-api/migrations/060_telegram_pet_sanctuary_indexes.sql
      - workers/moonboys-api/migrations/061_moonpet_season_economy_calibration.sql
      - workers/moonboys-api/migrations/062_moonpet_evolution_stage_5.sql
      - workers/moonboys-api/migrations/063_arcade_xp_spendable_wallet.sql
      - workers/moonboys-api/migrations/064_moonpet_beta_runtime_cutover.sql
      - workers/moonboys-api/migrations/065_moonpet_reward_pet_id_authority.sql
      - workers/moonboys-api/migrations/066_moonpet_run_pet_id_authority.sql
      - workers/moonboys-api/migrations/067_moonpet_daily_journey_authority.sql
      - workers/moonboys-api/migrations/068_moonpet_weekly_journey_authority.sql
      - workers/moonboys-api/migrations/069_moonpet_breeding_authority.sql
      - workers/moonboys-api/migrations/070_moonpet_pet_identity_achievement_authority.sql
      - workers/moonboys-api/migrations/071_moonpet_arena_pet_authority.sql
      - workers/moonboys-api/migrations/072_moonpet_identity_authority_verification.sql
      - workers/moonboys-api/migrations/073_moonpet_per_pet_specialist_progression.sql
      - workers/moonboys-api/migrations/074_moonpet_live_system_ownership_classification.sql
      - .github/workflows/d1-production-migration-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify parser syntax
        run: |
          node --check scripts/verify-d1-production-migrations.mjs
          node --check scripts/verify-d1-production-migrations.test.mjs
          node --check scripts/verify-d1-identity-authority-audit.mjs
          node --check scripts/verify-d1-moonpet-hardening-audit.mjs
          node --check scripts/report-d1-query-failure.mjs
      - name: Verify required migration contract
        run: node scripts/verify-d1-production-migrations.test.mjs
      - name: Verify Moonpet hardening audit parser contract
        run: node scripts/verify-d1-moonpet-hardening-audit.test.mjs
      - name: Verify known migration evidence
        shell: bash
        run: |
          printf '%s\n' '[{"success":true,"results":[{"name":"038_telegram_pet_equipment_progression.sql"},{"name":"039_telegram_pet_runtime_progression.sql"},{"name":"041_telegram_pet_repeat_reward_slots.sql"},{"name":"042_telegram_pet_roguelite_foundation.sql"},{"name":"043_telegram_pet_identity_expansion.sql"},{"name":"044_telegram_pet_daily_runs.sql"},{"name":"045_telegram_pet_inventory_cutover_reconciliation.sql"},{"name":"046_fix_pet_runtime_unique_constraints.sql"},{"name":"047_fix_telegram_leaderboard_reward_constraint.sql"},{"name":"048_telegram_pet_player_expansion.sql"},{"name":"049_telegram_pet_dialogue_history.sql"},{"name":"050_telegram_pet_guided_progression.sql"},{"name":"051_telegram_pet_content_reconciliation.sql"},{"name":"052_telegram_pet_live_systems.sql"},{"name":"053_telegram_pet_species_lifecycle.sql"},{"name":"054_telegram_pet_client_performance.sql"},{"name":"055_telegram_pet_season_slots.sql"},{"name":"056_telegram_pet_instance_state.sql"},{"name":"057_telegram_pet_lifecycle_pet_id.sql"},{"name":"058_telegram_pet_season_completion.sql"},{"name":"059_telegram_pet_sanctuary.sql"},{"name":"060_telegram_pet_sanctuary_indexes.sql"},{"name":"061_moonpet_season_economy_calibration.sql"},{"name":"062_moonpet_evolution_stage_5.sql"},{"name":"063_arcade_xp_spendable_wallet.sql"},{"name":"064_moonpet_beta_runtime_cutover.sql"},{"name":"065_moonpet_reward_pet_id_authority.sql"},{"name":"066_moonpet_run_pet_id_authority.sql"},{"name":"067_moonpet_daily_journey_authority.sql"},{"name":"068_moonpet_weekly_journey_authority.sql"},{"name":"069_moonpet_breeding_authority.sql"},{"name":"070_moonpet_pet_identity_achievement_authority.sql"},{"name":"071_moonpet_arena_pet_authority.sql"},{"name":"072_moonpet_identity_authority_verification.sql"},{"name":"073_moonpet_per_pet_specialist_progression.sql"},{"name":"074_moonpet_live_system_ownership_classification.sql"}]}]' > /tmp/d1-query.json
          node scripts/verify-d1-production-migrations.mjs --input /tmp/d1-query.json --request deployments/d1-evidence-request.json --output /tmp/d1-evidence.json
          node -e "const e=require('/tmp/d1-evidence.json'); if(e.status!=='verified-applied') process.exit(1)"
      - name: Verify sanitised failure reporting
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: contract-test-token
          CLOUDFLARE_ACCOUNT_ID: contract-test-account
        run: |
          printf '%s\n' '{"error":{"code":9109,"message":"Authentication failed for contract-test-account"}}' > /tmp/d1-failure.json
          printf '%s\n' 'token contract-test-token rejected' > /tmp/d1-failure.stderr
          node scripts/report-d1-query-failure.mjs /tmp/d1-failure.json /tmp/d1-failure.stderr /tmp/d1-failure.txt 2>/tmp/d1-failure-console.txt
          grep -F 'Authentication failed for [REDACTED]' /tmp/d1-failure.txt
          grep -F 'token [REDACTED] rejected' /tmp/d1-failure.txt
          if grep -F 'contract-test-token' /tmp/d1-failure.txt; then exit 1; fi
          if grep -F 'contract-test-account' /tmp/d1-failure.txt; then exit 1; fi

  verify-remote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN"
            missing=1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi

          [ "$missing" -eq 0 ]
      - name: Query production migration records
        id: d1-query
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "SELECT name FROM d1_migrations WHERE name IN ('038_telegram_pet_equipment_progression.sql', '039_telegram_pet_runtime_progression.sql', '041_telegram_pet_repeat_reward_slots.sql', '042_telegram_pet_roguelite_foundation.sql', '043_telegram_pet_identity_expansion.sql', '044_telegram_pet_daily_runs.sql', '045_telegram_pet_inventory_cutover_reconciliation.sql', '046_fix_pet_runtime_unique_constraints.sql', '047_fix_telegram_leaderboard_reward_constraint.sql', '048_telegram_pet_player_expansion.sql', '049_telegram_pet_dialogue_history.sql', '050_telegram_pet_guided_progression.sql', '051_telegram_pet_content_reconciliation.sql', '052_telegram_pet_live_systems.sql', '053_telegram_pet_species_lifecycle.sql', '054_telegram_pet_client_performance.sql', '055_telegram_pet_season_slots.sql', '056_telegram_pet_instance_state.sql', '057_telegram_pet_lifecycle_pet_id.sql', '058_telegram_pet_season_completion.sql', '059_telegram_pet_sanctuary.sql', '060_telegram_pet_sanctuary_indexes.sql', '061_moonpet_season_economy_calibration.sql', '062_moonpet_evolution_stage_5.sql', '063_arcade_xp_spendable_wallet.sql', '064_moonpet_beta_runtime_cutover.sql', '065_moonpet_reward_pet_id_authority.sql', '066_moonpet_run_pet_id_authority.sql', '067_moonpet_daily_journey_authority.sql', '068_moonpet_weekly_journey_authority.sql', '069_moonpet_breeding_authority.sql', '070_moonpet_pet_identity_achievement_authority.sql', '071_moonpet_arena_pet_authority.sql', '072_moonpet_identity_authority_verification.sql', '073_moonpet_per_pet_specialist_progression.sql', '074_moonpet_live_system_ownership_classification.sql') ORDER BY name" \
            --json > d1-migration-query.json 2> d1-migration-query.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Report sanitised query failure
        if: steps.d1-query.outputs.status != '0'
        shell: bash
        run: |
          node scripts/report-d1-query-failure.mjs \
            d1-migration-query.json \
            d1-migration-query.stderr \
            d1-query-failure.txt
          exit "${{ steps.d1-query.outputs.status }}"
      - name: Upload sanitised failure diagnostics
        if: always() && steps.d1-query.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: d1-query-failure-diagnostics
          path: d1-query-failure.txt
          if-no-files-found: error
          retention-days: 30
      - name: Validate and sanitise evidence
        if: steps.d1-query.outputs.status == '0'
        run: node scripts/verify-d1-production-migrations.mjs --input d1-migration-query.json --request deployments/d1-evidence-request.json --output d1-production-migration-evidence.json
      - name: Query production identity authority violations
        if: steps.d1-query.outputs.status == '0'
        id: d1-identity-audit
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "SELECT COUNT(*) AS invalid_identity_authority_rows FROM moonpet_invalid_identity_authority_rows" \
            --json > d1-identity-authority-audit.json 2> d1-identity-authority-audit.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Fail on production identity authority violations
        if: steps.d1-query.outputs.status == '0'
        id: d1-identity-audit-verify
        shell: bash
        run: |
          if [ "${{ steps.d1-identity-audit.outputs.status }}" != "0" ]; then
            node scripts/report-d1-query-failure.mjs \
              d1-identity-authority-audit.json \
              d1-identity-authority-audit.stderr \
              d1-identity-authority-audit-failure.txt
            echo "status=${{ steps.d1-identity-audit.outputs.status }}" >> "$GITHUB_OUTPUT"
            exit "${{ steps.d1-identity-audit.outputs.status }}"
          fi
          set +e
          node scripts/verify-d1-identity-authority-audit.mjs \
            --input d1-identity-authority-audit.json \
            --output d1-identity-authority-audit-result.txt \
            2> d1-identity-authority-audit-failure.txt
          verify_status=$?
          set -e
          echo "status=$verify_status" >> "$GITHUB_OUTPUT"
          if [ "$verify_status" != "0" ]; then
            cat d1-identity-authority-audit-failure.txt
            exit "$verify_status"
          fi
      - name: Upload sanitised identity audit failure diagnostics
        if: always() && steps.d1-query.outputs.status == '0' && steps.d1-identity-audit-verify.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: d1-identity-authority-audit-failure-diagnostics
          path: d1-identity-authority-audit-failure.txt
          if-no-files-found: error
          retention-days: 30
      - name: Query production Moonpet hardening schema objects
        if: steps.d1-query.outputs.status == '0'
        id: d1-hardening-schema
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "SELECT type, name FROM sqlite_master WHERE (type='view' AND name='moonpet_invalid_identity_authority_rows') OR (type='table' AND name IN ('telegram_pet_specialist_progression','telegram_pet_specialist_events','telegram_pet_live_progression_state','telegram_pet_system_events','telegram_pet_event_chain_progress','telegram_pet_seasonal_boss_progress')) OR (type='index' AND name IN ('idx_pet_specialist_progression_owner','idx_pet_specialist_events_owner_created','idx_pet_system_events_owner','idx_pet_system_events_pet_owner')) ORDER BY type, name" \
            --json > d1-hardening-schema.json 2> d1-hardening-schema.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Query production Moonpet specialist ownership audit
        if: steps.d1-query.outputs.status == '0'
        id: d1-hardening-specialist
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "WITH invalid_progression AS (SELECT COUNT(*) AS count FROM telegram_pet_specialist_progression s LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = s.pet_id AND slot.telegram_id = s.telegram_id AND slot.season_key = s.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = s.pet_id AND i.telegram_id = s.telegram_id AND i.season_key = s.season_key WHERE s.pet_id IS NULL OR s.pet_id = '' OR s.telegram_id IS NULL OR s.telegram_id = '' OR s.season_key IS NULL OR s.season_key = '' OR slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), invalid_events AS (SELECT COUNT(*) AS count FROM telegram_pet_specialist_events e LEFT JOIN telegram_pet_specialist_progression s ON s.pet_id = e.pet_id AND s.telegram_id = e.telegram_id AND s.season_key = e.season_key LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = e.pet_id AND slot.telegram_id = e.telegram_id AND slot.season_key = e.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = e.pet_id AND i.telegram_id = e.telegram_id AND i.season_key = e.season_key WHERE e.pet_id IS NULL OR e.pet_id = '' OR e.telegram_id IS NULL OR e.telegram_id = '' OR e.season_key IS NULL OR e.season_key = '' OR s.pet_id IS NULL OR slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), crossover AS (SELECT COUNT(*) AS count FROM (SELECT telegram_id, season_key, event_key, COUNT(DISTINCT pet_id) AS pet_count FROM telegram_pet_specialist_events GROUP BY telegram_id, season_key, event_key HAVING pet_count > 1)), wallet_pet_columns AS (SELECT (SELECT COUNT(*) FROM pragma_table_info('telegram_pet_profiles') WHERE name='pet_id') + (SELECT COUNT(*) FROM pragma_table_info('telegram_pet_material_balances') WHERE name='pet_id') + (SELECT COUNT(*) FROM pragma_table_info('telegram_pet_inventory') WHERE name='pet_id') AS count), wallet_balance_columns AS (SELECT (3 - (SELECT COUNT(*) FROM pragma_table_info('telegram_pet_profiles') WHERE name IN ('moon_gold','moon_crystals','style_tokens'))) AS count) SELECT (SELECT count FROM invalid_progression) AS invalid_specialist_progression_rows, (SELECT count FROM invalid_events) AS invalid_specialist_event_rows, (SELECT count FROM crossover) AS specialist_event_pet_crossovers, (SELECT count FROM wallet_pet_columns) AS account_wallet_pet_id_columns, (SELECT count FROM wallet_balance_columns) AS missing_wallet_balance_columns" \
            --json > d1-hardening-specialist.json 2> d1-hardening-specialist.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Query production Moonpet live ownership audit
        if: steps.d1-query.outputs.status == '0'
        id: d1-hardening-live
        shell: bash
        run: |
          set +e
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "WITH invalid_live_progression AS (SELECT COUNT(*) AS count FROM telegram_pet_live_progression_state p LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = p.pet_id AND slot.telegram_id = p.telegram_id AND slot.season_key = p.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = p.pet_id AND i.telegram_id = p.telegram_id AND i.season_key = p.season_key WHERE p.pet_id IS NULL OR p.pet_id = '' OR p.telegram_id IS NULL OR p.telegram_id = '' OR p.season_key IS NULL OR p.season_key = '' OR slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), invalid_system_events AS (SELECT COUNT(*) AS count FROM telegram_pet_system_events e LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = e.pet_id AND slot.telegram_id = e.telegram_id AND slot.season_key = e.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = e.pet_id AND i.telegram_id = e.telegram_id AND i.season_key = e.season_key WHERE e.system_key IN ('district','event_chain','seasonal_boss') AND (e.pet_id IS NULL OR e.pet_id = '' OR e.season_key IS NULL OR e.season_key = '' OR slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number)), invalid_event_chain AS (SELECT COUNT(*) AS count FROM telegram_pet_event_chain_progress c LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = c.pet_id AND slot.telegram_id = c.telegram_id AND slot.season_key = c.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = c.pet_id AND i.telegram_id = c.telegram_id AND i.season_key = c.season_key WHERE c.pet_id IS NULL OR c.pet_id = '' OR c.season_key IS NULL OR c.season_key = '' OR slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), invalid_seasonal_boss AS (SELECT COUNT(*) AS count FROM telegram_pet_seasonal_boss_progress b LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = b.pet_id AND slot.telegram_id = b.telegram_id AND slot.season_key = b.pet_season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = b.pet_id AND i.telegram_id = b.telegram_id AND i.season_key = b.pet_season_key WHERE b.pet_id IS NULL OR b.pet_id = '' OR b.pet_season_key IS NULL OR b.pet_season_key = '' OR slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), empty_pet_owned_events AS (SELECT COUNT(*) AS count FROM telegram_pet_system_events WHERE system_key IN ('district','event_chain','seasonal_boss') AND (pet_id IS NULL OR pet_id = '' OR season_key IS NULL OR season_key = '')), invalid_daily_journey AS (SELECT COUNT(*) AS count FROM telegram_pet_daily_journey_objectives d LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = d.pet_id AND slot.telegram_id = d.telegram_id AND slot.season_key = d.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = d.pet_id AND i.telegram_id = d.telegram_id AND i.season_key = d.season_key WHERE slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), invalid_weekly_journey AS (SELECT COUNT(*) AS count FROM telegram_pet_weekly_journey_objectives w LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = w.pet_id AND slot.telegram_id = w.telegram_id AND slot.season_key = w.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = w.pet_id AND i.telegram_id = w.telegram_id AND i.season_key = w.season_key WHERE slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number), invalid_daily_runs AS (SELECT COUNT(*) AS count FROM telegram_pet_daily_runs r LEFT JOIN telegram_pet_season_slots slot ON slot.pet_id = r.pet_id AND slot.telegram_id = r.telegram_id AND slot.season_key = r.season_key LEFT JOIN telegram_pet_instances i ON i.pet_id = r.pet_id AND i.telegram_id = r.telegram_id AND i.season_key = r.season_key WHERE r.pet_id IS NOT NULL AND r.pet_id <> '' AND (slot.pet_id IS NULL OR i.pet_id IS NULL OR slot.slot_number <> i.slot_number)) SELECT (SELECT count FROM invalid_live_progression) AS invalid_live_progression_rows, (SELECT count FROM invalid_system_events) AS invalid_system_event_rows, (SELECT count FROM invalid_event_chain) AS invalid_event_chain_rows, (SELECT count FROM invalid_seasonal_boss) AS invalid_seasonal_boss_rows, (SELECT count FROM empty_pet_owned_events) AS empty_pet_owned_system_events, (SELECT count FROM invalid_daily_journey) AS invalid_daily_journey_rows, (SELECT count FROM invalid_weekly_journey) AS invalid_weekly_journey_rows, (SELECT count FROM invalid_daily_runs) AS invalid_daily_run_rows" \
            --json > d1-hardening-live.json 2> d1-hardening-live.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Verify Moonpet hardening production audit
        if: steps.d1-query.outputs.status == '0'
        id: d1-hardening-verify
        shell: bash
        run: |
          if [ "${{ steps.d1-hardening-schema.outputs.status }}" != "0" ]; then
            node scripts/report-d1-query-failure.mjs d1-hardening-schema.json d1-hardening-schema.stderr d1-hardening-audit-failure.txt
            echo "status=${{ steps.d1-hardening-schema.outputs.status }}" >> "$GITHUB_OUTPUT"
            exit "${{ steps.d1-hardening-schema.outputs.status }}"
          fi
          if [ "${{ steps.d1-hardening-specialist.outputs.status }}" != "0" ]; then
            node scripts/report-d1-query-failure.mjs d1-hardening-specialist.json d1-hardening-specialist.stderr d1-hardening-audit-failure.txt
            echo "status=${{ steps.d1-hardening-specialist.outputs.status }}" >> "$GITHUB_OUTPUT"
            exit "${{ steps.d1-hardening-specialist.outputs.status }}"
          fi
          if [ "${{ steps.d1-hardening-live.outputs.status }}" != "0" ]; then
            node scripts/report-d1-query-failure.mjs d1-hardening-live.json d1-hardening-live.stderr d1-hardening-audit-failure.txt
            echo "status=${{ steps.d1-hardening-live.outputs.status }}" >> "$GITHUB_OUTPUT"
            exit "${{ steps.d1-hardening-live.outputs.status }}"
          fi
          set +e
          node scripts/verify-d1-moonpet-hardening-audit.mjs \
            --schema-input d1-hardening-schema.json \
            --specialist-input d1-hardening-specialist.json \
            --live-input d1-hardening-live.json \
            --output d1-moonpet-hardening-audit-evidence.json \
            2> d1-hardening-audit-failure.txt
          verify_status=$?
          set -e
          echo "status=$verify_status" >> "$GITHUB_OUTPUT"
          if [ "$verify_status" != "0" ]; then
            cat d1-hardening-audit-failure.txt
            exit "$verify_status"
          fi
      - name: Upload sanitised Moonpet hardening audit failure diagnostics
        if: always() && steps.d1-query.outputs.status == '0' && steps.d1-hardening-verify.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: d1-moonpet-hardening-audit-failure-diagnostics
          path: d1-hardening-audit-failure.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitised evidence
        if: steps.d1-query.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: d1-production-migration-evidence
          path: |
            d1-production-migration-evidence.json
            d1-identity-authority-audit-result.txt
            d1-moonpet-hardening-audit-evidence.json
          if-no-files-found: error
          retention-days: 90
