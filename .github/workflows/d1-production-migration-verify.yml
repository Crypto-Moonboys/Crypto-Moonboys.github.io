name: D1 Production Migration Verify

on:
  pull_request:
    paths:
      - deployments/d1-evidence-request.json
      - scripts/verify-d1-production-migrations.mjs
      - .github/workflows/d1-production-migration-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify parser syntax
        run: node --check scripts/verify-d1-production-migrations.mjs
      - name: Verify known migration evidence
        shell: bash
        run: |
          printf '%s\n' '[{"success":true,"results":[{"name":"038_telegram_pet_equipment_progression.sql"},{"name":"039_telegram_pet_runtime_progression.sql"}]}]' > /tmp/d1-query.json
          node scripts/verify-d1-production-migrations.mjs --input /tmp/d1-query.json --request deployments/d1-evidence-request.json --output /tmp/d1-evidence.json
          node -e "const e=require('/tmp/d1-evidence.json'); if(e.status!=='verified-applied') process.exit(1)"

  verify-remote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN"
            missing=1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi

          [ "$missing" -eq 0 ]
      - name: Query production migration records
        shell: bash
        run: |
          npx wrangler d1 execute wikicoms \
            --remote \
            --config workers/moonboys-api/wrangler.toml \
            --command "SELECT name FROM d1_migrations WHERE name IN ('038_telegram_pet_equipment_progression.sql', '039_telegram_pet_runtime_progression.sql') ORDER BY name" \
            --json > d1-migration-query.json
      - name: Validate and sanitise evidence
        run: node scripts/verify-d1-production-migrations.mjs --input d1-migration-query.json --request deployments/d1-evidence-request.json --output d1-production-migration-evidence.json
      - name: Upload sanitised evidence
        uses: actions/upload-artifact@v4
        with:
          name: d1-production-migration-evidence
          path: d1-production-migration-evidence.json
          if-no-files-found: error
          retention-days: 90
