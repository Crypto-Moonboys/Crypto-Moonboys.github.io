name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      wiki: ${{ steps.route.outputs.wiki }}
      worker_api: ${{ steps.route.outputs.worker_api }}
      arcade: ${{ steps.route.outputs.arcade }}
      wax: ${{ steps.route.outputs.wax }}
      visual: ${{ steps.route.outputs.visual }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route changed paths
        id: route
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "wiki=true"
              echo "worker_api=true"
              echo "arcade=true"
              echo "wax=true"
              echo "visual=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main "$head")"
          fi

          wiki=false
          worker_api=false
          arcade=false
          wax=false
          visual=false

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml|package.json|package-lock.json|scripts/ci-domain-runner.mjs)
                wiki=true
                worker_api=true
                arcade=true
                wax=true
                visual=true
                ;;
              arcade/**|js/arcade/**|scripts/*arcade*|scripts/*btqm*|scripts/*invaders*)
                arcade=true
                ;;
              wax/**|scripts/*wax*)
                wax=true
                ;;
              workers/**|scripts/*worker*|scripts/telegram-pets/**|scripts/telegram-pets*|scripts/moonpet*|scripts/verify-d1-production-migrations*|deployments/**)
                worker_api=true
                ;;
              js/**|css/**|*.html|wiki/**)
                wiki=true
                visual=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          {
            echo "wiki=$wiki"
            echo "worker_api=$worker_api"
            echo "arcade=$arcade"
            echo "wax=$wax"
            echo "visual=$visual"
          } >> "$GITHUB_OUTPUT"

  ci-wiki:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.wiki == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run wiki tests
        run: npm run ci:wiki

  ci-worker-api:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.worker_api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run worker/API tests
        run: npm run ci:worker-api

  ci-arcade:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.arcade == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Hydrate Invaders player-ship PNG asset
        run: npm run invaders:ship:hydrate

      - name: Run arcade tests
        run: npm run ci:arcade

  ci-wax:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.wax == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run WAX tests
        run: npm run ci:wax

  ci-visual:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.visual == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual/static tests
        run: npm run ci:visual
