name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run wiki tests
        run: npm run ci:wiki

  ci-worker-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run worker/API tests
        run: npm run ci:worker-api

  ci-arcade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Hydrate Invaders player-ship PNG asset
        run: npm run invaders:ship:hydrate

      - name: Run arcade tests
        run: npm run ci:arcade

  ci-wax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run WAX tests
        run: npm run ci:wax

  ci-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check visual/runtime frontend changes
        id: visual_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No reliable base commit found; running ci-visual."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${HEAD_SHA:-}" ] || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "No reliable head commit found; running ci-visual."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files detected; skipping ci-visual."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            if [[ "$file" == .github/workflows/ci.yml ||
                  "$file" == package.json ||
                  "$file" == package-lock.json ||
                  "$file" == playwright.config.* ||
                  "$file" == *.html ||
                  "$file" == */*.html ||
                  "$file" == css/* ||
                  "$file" == */*.css ||
                  "$file" == js/* ||
                  "$file" == art/* ||
                  "$file" == assets/* ||
                  "$file" == img/* ||
                  "$file" == og-templates/* ||
                  "$file" == snapshots/* ||
                  "$file" == games/* ||
                  "$file" == battle-chamber/* ||
                  "$file" == avatar-builder-test.html ||
                  "$file" == scripts/*visual* ||
                  "$file" == scripts/avatar-builder-* ||
                  "$file" == scripts/portal-artwork.test.mjs ||
                  "$file" == scripts/right-rail-live-panels.test.mjs ||
                  "$file" == scripts/favicon-consistency.test.mjs ||
                  "$file" == scripts/anti-drift-check.mjs ||
                  "$file" == scripts/no-dead-placeholder-copy.mjs ||
                  "$file" == scripts/public-copy-trust-guard.test.mjs ||
                  "$file" == scripts/live-site-verify-static.test.mjs ||
                  "$file" == scripts/site-shell-parity-audit.mjs ||
                  "$file" == scripts/homepage-build-moonboy-hero.test.mjs ]]; then
              echo "Visual/runtime frontend change detected: $file"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No visual/runtime frontend files changed; skipping ci-visual."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.visual_changes.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.visual_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        if: steps.visual_changes.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run visual/static tests
        if: steps.visual_changes.outputs.should_run == 'true'
        run: npm run ci:visual
