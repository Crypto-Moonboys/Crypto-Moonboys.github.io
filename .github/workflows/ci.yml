name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check wiki/static changes
        id: wiki_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs wiki

      - name: Install dependencies
        if: steps.wiki_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve canon prose approval
        id: canon_approval
        if: steps.wiki_changes.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-canon-prose-approval.mjs

      - name: Run wiki tests
        if: steps.wiki_changes.outputs.should_run == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CANON_PROSE_CHANGE_APPROVED: ${{ steps.canon_approval.outputs.approved || '0' }}
        run: npm run ci:wiki

  ci-worker-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run worker/API tests
        run: npm run ci:worker-api

  ci-arcade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check arcade/frontend changes
        id: arcade_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs arcade

      - name: Install dependencies
        if: steps.arcade_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Hydrate Invaders player-ship PNG asset
        if: steps.arcade_changes.outputs.should_run == 'true'
        run: npm run invaders:ship:hydrate

      - name: Run arcade tests
        if: steps.arcade_changes.outputs.should_run == 'true'
        run: npm run ci:arcade

  ci-wax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check WAX/static changes
        id: wax_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs wax

      - name: Install dependencies
        if: steps.wax_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run WAX tests
        if: steps.wax_changes.outputs.should_run == 'true'
        run: npm run ci:wax

  ci-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check visual/runtime frontend changes
        id: visual_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs visual

      - name: Install dependencies
        if: steps.visual_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        if: steps.visual_changes.outputs.should_run == 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run visual/static tests
        if: steps.visual_changes.outputs.should_run == 'true'
        timeout-minutes: 20
        run: npm run ci:visual

      - name: Upload visual failure artifacts
        if: failure() && steps.visual_changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-visual-failure-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
