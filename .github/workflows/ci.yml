name: CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Generated graph PR number; GitHub verifies the real base and exact head'
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  fast-edit:
    runs-on: ubuntu-latest
    outputs:
      fast_edit: ${{ steps.detect.outputs.fast_edit }}
    steps:
      - name: Checkout full history for trusted file diff
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate classifier safety rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          # A PR cannot supply its own authoritative classifier or safety tests.
          if git cat-file -e "$BASE_SHA:scripts/fast-edit-scope.mjs" 2>/dev/null &&
             git cat-file -e "$BASE_SHA:scripts/fast-edit-scope.test.mjs" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/trusted-fast-edit"
            git show "$BASE_SHA:scripts/fast-edit-scope.mjs" > "$RUNNER_TEMP/trusted-fast-edit/fast-edit-scope.mjs"
            git show "$BASE_SHA:scripts/fast-edit-scope.test.mjs" > "$RUNNER_TEMP/trusted-fast-edit/fast-edit-scope.test.mjs"
            node --test "$RUNNER_TEMP/trusted-fast-edit/fast-edit-scope.test.mjs"
          else
            echo "No protected base classifier: this bootstrap PR must run full CI."
          fi
      - name: Classify change scope using protected base
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:scripts/fast-edit-scope.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/fast-edit-scope.mjs" > "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
            node "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
          else
            echo "fast_edit=false" >> "$GITHUB_OUTPUT"
            echo "Protected base has no classifier: full CI required."
          fi
      - name: Fast Edit whitespace check
        if: steps.detect.outputs.fast_edit == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  ci-wiki:
    needs: [fast-edit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed Fast Edit prerequisite
        if: needs.fast-edit.result != 'success'
        run: |
          echo 'Fast Edit prerequisite failed or was skipped; refusing to mark required CI successful.'
          exit 1
      - name: Fast Edit accepted — skip unrelated heavy suites
        if: needs.fast-edit.outputs.fast_edit == 'true'
        run: |
          echo "Fast Edit: existing required job satisfied; heavyweight suite not relevant."
      - name: Checkout
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate generated graph PR dispatch
        id: graph_dispatch
        if: needs.fast-edit.outputs.fast_edit != 'true' && github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/verify-graph-dispatch-pr.test.mjs
          node scripts/verify-graph-dispatch-pr.mjs

      - name: Check wiki/static changes
        if: needs.fast-edit.outputs.fast_edit != 'true'
        id: wiki_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || steps.graph_dispatch.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs wiki

      - name: Install dependencies
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.wiki_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve canon prose approval
        id: canon_approval
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.wiki_changes.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-canon-prose-approval.mjs

      - name: Run wiki tests
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.wiki_changes.outputs.should_run == 'true' && github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CANON_PROSE_CHANGE_APPROVED: ${{ steps.canon_approval.outputs.approved || '0' }}
        run: npm run ci:wiki

      - name: Run wiki tests explicitly dispatched
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.wiki_changes.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ steps.graph_dispatch.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          CANON_PROSE_CHANGE_APPROVED: ${{ steps.canon_approval.outputs.approved || '0' }}
        run: npm run ci:wiki

      - name: Validate candidate Fast Edit classifier outside gate runner
        if: needs.fast-edit.outputs.fast_edit != 'true' && github.event_name == 'pull_request' && steps.wiki_changes.outputs.should_run == 'true'
        run: node --test scripts/fast-edit-scope.test.mjs

  ci-worker-api:
    needs: [fast-edit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed Fast Edit prerequisite
        if: needs.fast-edit.result != 'success'
        run: |
          echo 'Fast Edit prerequisite failed or was skipped; refusing to mark required CI successful.'
          exit 1
      - name: Fast Edit accepted — skip unrelated heavy suites
        if: needs.fast-edit.outputs.fast_edit == 'true'
        run: |
          echo "Fast Edit: existing required job satisfied; heavyweight suite not relevant."
      - name: Checkout
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate generated graph PR dispatch
        id: graph_dispatch
        if: needs.fast-edit.outputs.fast_edit != 'true' && github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/verify-graph-dispatch-pr.test.mjs
          node scripts/verify-graph-dispatch-pr.mjs

      - name: Install dependencies
        if: needs.fast-edit.outputs.fast_edit != 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run worker/API tests
        if: needs.fast-edit.outputs.fast_edit != 'true'
        run: npm run ci:worker-api

  ci-arcade:
    needs: [fast-edit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed Fast Edit prerequisite
        if: needs.fast-edit.result != 'success'
        run: |
          echo 'Fast Edit prerequisite failed or was skipped; refusing to mark required CI successful.'
          exit 1
      - name: Fast Edit accepted — skip unrelated heavy suites
        if: needs.fast-edit.outputs.fast_edit == 'true'
        run: |
          echo "Fast Edit: existing required job satisfied; heavyweight suite not relevant."
      - name: Checkout
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate generated graph PR dispatch
        id: graph_dispatch
        if: needs.fast-edit.outputs.fast_edit != 'true' && github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/verify-graph-dispatch-pr.test.mjs
          node scripts/verify-graph-dispatch-pr.mjs

      - name: Check arcade/frontend changes
        if: needs.fast-edit.outputs.fast_edit != 'true'
        id: arcade_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || steps.graph_dispatch.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs arcade

      - name: Install dependencies
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.arcade_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Hydrate Invaders player-ship PNG asset
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.arcade_changes.outputs.should_run == 'true'
        run: npm run invaders:ship:hydrate

      - name: Run arcade tests
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.arcade_changes.outputs.should_run == 'true'
        run: npm run ci:arcade

  ci-wax:
    needs: [fast-edit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed Fast Edit prerequisite
        if: needs.fast-edit.result != 'success'
        run: |
          echo 'Fast Edit prerequisite failed or was skipped; refusing to mark required CI successful.'
          exit 1
      - name: Fast Edit accepted — skip unrelated heavy suites
        if: needs.fast-edit.outputs.fast_edit == 'true'
        run: |
          echo "Fast Edit: existing required job satisfied; heavyweight suite not relevant."
      - name: Checkout
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate generated graph PR dispatch
        id: graph_dispatch
        if: needs.fast-edit.outputs.fast_edit != 'true' && github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/verify-graph-dispatch-pr.test.mjs
          node scripts/verify-graph-dispatch-pr.mjs

      - name: Check WAX/static changes
        if: needs.fast-edit.outputs.fast_edit != 'true'
        id: wax_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || steps.graph_dispatch.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs wax

      - name: Install dependencies
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.wax_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run WAX tests
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.wax_changes.outputs.should_run == 'true'
        run: npm run ci:wax

  ci-visual:
    needs: [fast-edit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reject failed Fast Edit prerequisite
        if: needs.fast-edit.result != 'success'
        run: |
          echo 'Fast Edit prerequisite failed or was skipped; refusing to mark required CI successful.'
          exit 1
      - name: Fast Edit accepted — skip unrelated heavy suites
        if: needs.fast-edit.outputs.fast_edit == 'true'
        run: |
          echo "Fast Edit: existing required job satisfied; heavyweight suite not relevant."
      - name: Checkout
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.fast-edit.outputs.fast_edit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate generated graph PR dispatch
        id: graph_dispatch
        if: needs.fast-edit.outputs.fast_edit != 'true' && github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/verify-graph-dispatch-pr.test.mjs
          node scripts/verify-graph-dispatch-pr.mjs

      - name: Check visual/runtime frontend changes
        if: needs.fast-edit.outputs.fast_edit != 'true'
        id: visual_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || steps.graph_dispatch.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.mjs visual

      - name: Install dependencies
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.visual_changes.outputs.should_run == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.visual_changes.outputs.should_run == 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run visual/static tests
        if: needs.fast-edit.outputs.fast_edit != 'true' && steps.visual_changes.outputs.should_run == 'true'
        timeout-minutes: 20
        run: npm run ci:visual

      - name: Upload visual failure artifacts
        if: needs.fast-edit.outputs.fast_edit != 'true' && failure() && steps.visual_changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-visual-failure-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
