name: Temporary First Witness life expansion refresh

on:
  push:
    branches:
      - canon/first-witness-life-resonance-expansion
    paths:
      - ".github/workflows/refresh-first-witness-life.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: canon/first-witness-life-resonance-expansion
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh and converge publishing surfaces
        shell: bash
        run: |
          node scripts/wiki-publish-gate.js
          for pass in 1 2 3; do
            echo "Publishing convergence pass $pass"
            node scripts/generate-publishing-surfaces.mjs
          done
          node scripts/graph-publishing-integrity.test.mjs
          npm run ci:wiki
      - name: Commit generated surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/wiki-publish-audit.json \
            js/wiki-index.json \
            js/link-map.json \
            js/link-graph.json \
            js/entity-map.json \
            sam-memory.json \
            js/entity-graph.json \
            js/graph-data.json \
            js/entity-graph-lite.json \
            sitemap.xml \
            js/site-stats.json \
            index_stats.json
          if git diff --cached --quiet; then
            echo "Publishing surfaces already current."
          else
            git commit -m "chore(wiki): generate First Witness life expansion surfaces"
            git push origin HEAD:canon/first-witness-life-resonance-expansion
          fi
