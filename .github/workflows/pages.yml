name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify NBG course scoring Worker before Pages rollout
        # New Level 1 course physics must never publish ahead of its server.
        # Failure leaves the existing GitHub Pages deployment untouched.
        run: node scripts/verify-nbg-pages-worker-course.mjs

      - name: Verify NBG Telegram group gate API before Pages rollout
        # The live site must never publish a members-only client before the
        # Moonboys API can perform the server-side Telegram membership check.
        run: node scripts/verify-nbg-group-gate-worker.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages artifact
        run: node scripts/prepare-pages-artifact.mjs public-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public-site

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Notify the Brand Brain after the site is live
        if: success()
        continue-on-error: true
        env:
          BRAIN_CANON_DISPATCH_TOKEN: ${{ secrets.BRAIN_CANON_DISPATCH_TOKEN }}
        run: |
          if [ -z "$BRAIN_CANON_DISPATCH_TOKEN" ]; then exit 0; fi
          curl --silent --show-error --fail --max-time 15 \
            --request POST \
            --header "Authorization: Bearer $BRAIN_CANON_DISPATCH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data '{"event_type":"moonboys-pages-published"}' \
            https://api.github.com/repos/HODLKONG64/the-brain/dispatches
