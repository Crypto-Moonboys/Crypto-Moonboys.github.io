name: Temporary Fifth Carbon publishing regeneration (sandbox)

on:
  push:
    branches:
      - codex/sandbox-canon-wiki-recovery-20261008-0720

permissions:
  contents: write

concurrency:
  group: fifth-carbon-regenerate-sandbox
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'Crypto-Moonboys/Crypto-Moonboys.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sandbox-canon-wiki-recovery-20261008-0720
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate search, site graphs and sitemap
        run: node scripts/generate-publishing-surfaces.mjs
      - name: Regenerate protected wiki content state
        run: node scripts/generate-wiki-content-state.mjs
      - name: Validate generated patches
        run: git diff --check
      - name: Commit generated data only to the sandbox branch
        shell: bash
        run: |
          git add -- js/wiki-index.json js/link-map.json js/link-graph.json js/entity-map.json js/entity-graph.json js/graph-data.json js/entity-graph-lite.json js/site-stats.json sitemap.xml index_stats.json sam-memory.json brand-canon/wiki-content-state.json brand-canon/wiki-rewrite-audit.md
          if git diff --cached --quiet; then
            echo "All generated surfaces already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(canon): regenerate wiki search graph and ownership surfaces"
          git push origin HEAD:codex/sandbox-canon-wiki-recovery-20261008-0720
