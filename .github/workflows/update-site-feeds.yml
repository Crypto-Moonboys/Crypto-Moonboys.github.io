name: Update site data feeds

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh GKniftyHEADS staged rarity caches
        run: |
          node scripts/update-gkniftyheads-template-metadata-cache.mjs
          node scripts/update-gkniftyheads-live-supply-cache.mjs
          node scripts/update-gkniftyheads-asset-state-cache.mjs
          node scripts/generate-gkniftyheads-rarity.mjs
          node scripts/retry-gkniftyheads-thumbnails.mjs --cached-only

      - name: Update feeds
        env:
          GK_USE_EXISTING_STAGED_CACHES: '1'
        run: node scripts/update-site-feeds.mjs

      - name: Validate feed registry
        run: node scripts/site-feed-registry.test.mjs

      - name: Validate GKniftyHEADS rarity
        run: node scripts/gkniftyheads-rarity-ranking.test.mjs

      - name: Run relevant audits
        run: |
          node scripts/audit-gkniftyheads-hub-links.mjs
          node scripts/audit-nft-pages-and-feed-sync.mjs
          node scripts/audit-related-wiki-paths.mjs

      - name: Commit changed feed data
        shell: bash
        run: |
          GENERATED_PATHS=(
            data/gkniftyheads/
            data/gkniftyheads_rarity/
            data/feed-status.json
            wiki/gkniftyheads-nft-collection.html
            img/gkniftyheads/thumbs/
            img/gkniftyheads/thumbs/manifest.json
          )
          if [[ -n "$(git status --short "${GENERATED_PATHS[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${GENERATED_PATHS[@]}"
            git commit -m "chore: update site data feeds"
            git push
          else
            echo "No generated feed changes to commit."
          fi
