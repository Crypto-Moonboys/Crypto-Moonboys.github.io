name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC-based Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments; do not cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Hydrate generated BTQM PNG assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'art/btqm/generated';
          const pngMagic = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          const encodedFiles = walk(root).filter((file) => file.endsWith('.png.base64'));
          for (const encodedFile of encodedFiles) {
            const pngPath = encodedFile.replace(/\.base64$/u, '');
            const buffer = Buffer.from(fs.readFileSync(encodedFile, 'utf8').replace(/\s+/gu, ''), 'base64');
            if (buffer.length < pngMagic.length || !buffer.subarray(0, pngMagic.length).equals(pngMagic)) {
              throw new Error(`Decoded file is not a PNG: ${encodedFile}`);
            }
            fs.writeFileSync(pngPath, buffer);
            console.log(`Hydrated ${pngPath}`);
          }

          console.log(`Hydrated ${encodedFiles.length} BTQM generated PNG asset(s).`);
          NODE

      - name: Prune non-static backend directories
        # server/ and workers/ contain backend source code that is not served
        # by GitHub Pages.  Remove them before packaging the artifact so the
        # upload is smaller and deployment is faster.
        run: |
          rm -rf server/ workers/ scripts/ patches/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
