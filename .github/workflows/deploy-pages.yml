name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC-based Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments; do not cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Hydrate generated BTQM PNG assets
        run: node scripts/hydrate-btqm-generated-assets.mjs --clean-base64

      - name: Prune non-static backend directories
        # server/ and workers/ contain backend source code that is not served
        # by GitHub Pages.  Remove them before packaging the artifact so the
        # upload is smaller and deployment is faster.
        run: |
          rm -rf server/ workers/ scripts/ patches/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_final.outputs.page_url || steps.deployment_retry_last.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "Deployment failed (status: ${{ steps.deployment.outcome }}). Waiting 90 s for Pages to stabilize before retry..."
          sleep 90

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "Second deployment attempt failed. Waiting 180 s for Pages to stabilize before final retry..."
          sleep 180

      - name: Deploy to GitHub Pages (final retry)
        id: deployment_retry_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before last retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry_final.outcome == 'failure'
        run: |
          echo "Final deployment attempt failed. Waiting 300 s before one last retry..."
          sleep 300

      - name: Deploy to GitHub Pages (last retry)
        id: deployment_retry_last
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry_final.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail deploy job after all retries
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry_final.outcome == 'failure' && steps.deployment_retry_last.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed after 4 attempts."
          exit 1
