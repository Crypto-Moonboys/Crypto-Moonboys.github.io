name: One-shot Arcade Score and URL Repair

on:
  push:
    branches:
      - fix/arcade-score-and-canonical-urls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-score-and-canonical-urls
          fetch-depth: 0

      - name: Patch score authority and canonical URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          worker_path = Path('workers/leaderboard-worker.js')
          worker = worker_path.read_text(encoding='utf-8')

          old_queries = '''    const [user, anticheat, linkEvent, blockTopiaProgression] = await Promise.all([
      env.DB.prepare(
        `SELECT telegram_id, username, first_name, last_name
         FROM telegram_users
         WHERE telegram_id = ?
         LIMIT 1`
      ).bind(normalizedTelegramId).first().catch(() => null),
      env.DB.prepare(
        `SELECT is_blocked, block_type, blocked_reason
         FROM telegram_anticheat_state
         WHERE telegram_id = ?
         LIMIT 1`
      ).bind(normalizedTelegramId).first().catch(() => null),
      env.DB.prepare(
        `SELECT action, created_at
         FROM telegram_activity_log
         WHERE telegram_id = ? AND action = 'link_confirmed'
         ORDER BY created_at DESC
         LIMIT 1`
      ).bind(normalizedTelegramId).first().catch(() => null),
      env.DB.prepare(
        `SELECT telegram_id
         FROM blocktopia_progression
         WHERE telegram_id = ?
         LIMIT 1`
      ).bind(normalizedTelegramId).first().catch(() => null),
    ]);'''

          new_queries = '''    const [user, anticheat] = await Promise.all([
      env.DB.prepare(
        `SELECT telegram_id, username, first_name, last_name
         FROM telegram_users
         WHERE telegram_id = ?
         LIMIT 1`
      ).bind(normalizedTelegramId).first().catch(() => null),
      env.DB.prepare(
        `SELECT is_blocked, block_type, blocked_reason
         FROM telegram_anticheat_state
         WHERE telegram_id = ?
         LIMIT 1`
      ).bind(normalizedTelegramId).first().catch(() => null),
    ]);'''

          if old_queries not in worker:
              raise SystemExit('Expected linked-state query block not found')
          worker = worker.replace(old_queries, new_queries, 1)

          old_link_gate = '''    const linked = Boolean(linkEvent || blockTopiaProgression);
    if (!linked) {
      return { ok: false, error: 'telegram_link_required', status: 403 };
    }

    return {
      ok: true,
      telegramId: String(user.telegram_id),
      user,
      anticheat,
      linked: true,
    };'''

          new_link_gate = '''    // Signed Telegram auth has already proven control of this identity.
    // Presence in telegram_users is the authoritative server record. Requiring
    // a separate activity-log or progression row falsely rejects valid linked
    // players before their first accepted Arcade score.
    return {
      ok: true,
      telegramId: String(user.telegram_id),
      user,
      anticheat,
      linked: true,
    };'''

          if old_link_gate not in worker:
              raise SystemExit('Expected secondary linked-state gate not found')
          worker = worker.replace(old_link_gate, new_link_gate, 1)

          health_anchor = '''    if (request.method === "OPTIONS") {
      return new Response(null, { status: 204, headers: corsHeaders });
    }

    // Lazy reset check on every request
'''
          health_replacement = '''    if (request.method === "OPTIONS") {
      return new Response(null, { status: 204, headers: corsHeaders });
    }

    if (path === "/health" && request.method === "GET") {
      return new Response(JSON.stringify({
        ok: true,
        service: "moonboys-leaderboard",
        canonical_games: GAMES,
        telegram_auth_configured: Boolean(env.TELEGRAM_BOT_TOKEN),
        database_configured: Boolean(env.DB),
        leaderboard_store_configured: Boolean(env.LEADERBOARD),
      }), { headers: corsHeaders });
    }

    // Lazy reset check on every request
'''
          if health_anchor not in worker:
              raise SystemExit('Expected Worker health insertion anchor not found')
          worker = worker.replace(health_anchor, health_replacement, 1)
          worker_path.write_text(worker, encoding='utf-8')

          routes = {
              '/games/invaders-3008/': '/games/meme-swarm-3008/',
              '/games/pac-chain/': '/games/chain-maze/',
              '/games/asteroid-fork/': '/games/forkfield/',
              '/games/breakout-bullrun/': '/games/bullrun-brick-smash/',
              '/games/tetris-block-topia/': '/games/block-topia-dropzone/',
          }

          for rel in ['games/index.html', 'js/arcade/arcade-manifest.js']:
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              for old, new in routes.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          redirects = '''# Canonical original-brand Arcade URLs.
# The implementation/assets remain in their established physical directories.
/games/meme-swarm-3008/* /games/invaders-3008/:splat 200
/games/chain-maze/* /games/pac-chain/:splat 200
/games/forkfield/* /games/asteroid-fork/:splat 200
/games/bullrun-brick-smash/* /games/breakout-bullrun/:splat 200
/games/block-topia-dropzone/* /games/tetris-block-topia/:splat 200
'''
          Path('_redirects').write_text(redirects, encoding='utf-8')

          test_path = Path('scripts/competitive-arcade-bootstrap-gate.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = "console.log('Competitive arcade bootstrap gate checks passed.');"
          checks = r'''

const leaderboardWorker = await fs.readFile(path.join(ROOT, 'workers/leaderboard-worker.js'), 'utf8');
assert(
  !leaderboardWorker.includes("linkEvent || blockTopiaProgression"),
  'leaderboard Worker must not reject a signed registered Telegram user for lacking a prior activity/progression row',
);
assert(
  leaderboardWorker.includes('path === "/health"'),
  'leaderboard Worker must expose a public configuration health endpoint',
);

const arcadeManifest = await fs.readFile(path.join(ROOT, 'js/arcade/arcade-manifest.js'), 'utf8');
for (const route of [
  '/games/meme-swarm-3008/',
  '/games/chain-maze/',
  '/games/forkfield/',
  '/games/bullrun-brick-smash/',
  '/games/block-topia-dropzone/',
]) {
  assert(arcadeManifest.includes(`page: '${route}'`), `Arcade manifest must use canonical route ${route}`);
}

const redirects = await fs.readFile(path.join(ROOT, '_redirects'), 'utf8');
assert(redirects.includes('/games/meme-swarm-3008/* /games/invaders-3008/:splat 200'));
assert(redirects.includes('/games/chain-maze/* /games/pac-chain/:splat 200'));
assert(redirects.includes('/games/forkfield/* /games/asteroid-fork/:splat 200'));
assert(redirects.includes('/games/bullrun-brick-smash/* /games/breakout-bullrun/:splat 200'));
assert(redirects.includes('/games/block-topia-dropzone/* /games/tetris-block-topia/:splat 200'));
'''
          if marker not in test:
              raise SystemExit('Expected test insertion marker not found')
          test = test.replace(marker, checks + '\n' + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-arcade-score-urls-once.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/leaderboard-worker.js games/index.html js/arcade/arcade-manifest.js scripts/competitive-arcade-bootstrap-gate.test.mjs _redirects .github/workflows/fix-arcade-score-urls-once.yml
          git commit -m "Fix Arcade score acceptance and canonical URLs"
          git push origin HEAD:fix/arcade-score-and-canonical-urls

# Triggered after workflow registration.
