name: Moonpet Production Canary

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Full moonboys-api commit already deployed to production"
        required: true
        type: string
      action:
        description: "Optional canary care action"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - feed
          - play
          - clean
      allow_action:
        description: "Confirm the optional action may mutate the dedicated canary pet"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout main for provenance validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require expected commit to be merged into main
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_commit must be a full 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git rev-parse --verify --quiet "$EXPECTED_COMMIT^{commit}" >/dev/null; then
            echo "expected_commit is not present in origin/main history" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main; then
            echo "expected_commit is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Checkout verified expected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live Moonpet state and leaderboards
        env:
          MOONPET_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MOONPET_CANARY_BOT_TOKEN: ${{ secrets.MOONPET_CANARY_BOT_TOKEN }}
          MOONPET_CANARY_TELEGRAM_ID: ${{ secrets.MOONPET_CANARY_TELEGRAM_ID }}
          MOONPET_CANARY_ALLOW_WRITES: "1"
          MOONPET_CANARY_ACTION: ${{ inputs.action }}
          MOONPET_CANARY_ALLOW_ACTION: ${{ inputs.allow_action && '1' || '0' }}
        run: node scripts/moonpet-production-canary.mjs
