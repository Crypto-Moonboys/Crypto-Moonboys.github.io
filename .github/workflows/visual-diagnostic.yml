name: Visual Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  homepage-audit-group:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [index, css, animation, url-safety, wiring]
    name: homepage-audit (${{ matrix.group }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run homepage audit group
        env:
          HOMEPAGE_AUDIT_GROUP: ${{ matrix.group }}
        run: node scripts/homepage-audit-regression.test.mjs
