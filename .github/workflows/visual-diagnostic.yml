name: Visual Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - scripts/portal-artwork.test.mjs
          - scripts/right-rail-live-panels.test.mjs
          - scripts/favicon-consistency.test.mjs
          - scripts/anti-drift-check.mjs
          - scripts/homepage-audit-regression.test.mjs
          - scripts/no-dead-placeholder-copy.mjs
          - scripts/public-copy-trust-guard.test.mjs
          - scripts/ci-domain-groups.test.mjs
          - scripts/live-site-verify-static.test.mjs
          - scripts/site-shell-parity-audit.mjs
          - scripts/visual-parity-swarmsy-audit.mjs
    name: visual-diag (${{ matrix.test }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run isolated visual check
        run: node "${{ matrix.test }}"
