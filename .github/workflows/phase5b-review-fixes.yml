name: Final Phase 5 Runtime Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pets-phase-5-final-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch API awards and gear progression
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'workers/moonboys-api/worker.js';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(anchor, replacement, label) {
            if (!source.includes(anchor)) throw new Error(`Missing anchor: ${label}`);
            source = source.replace(anchor, replacement);
          }

          replaceOnce(
            "      }\n      return json({ ...result, pet: serializePet(result.pet) }, result.accepted ? 200 : 409);\n",
            "      }\n      if (result?.accepted && !result?.duplicate) {\n        const runtimeAction = ({\n          feed: 'feed',\n          play: 'play',\n          clean: 'clean',\n          sleep: 'sleep',\n          train: 'train',\n          work: 'job',\n          daily_chest: 'daily_chest',\n          run_step: 'run_step',\n          run_extract: 'run_extract',\n        })[String(body.action || '').trim()];\n        const runtimeEventKey = String(body.event_key || '').trim();\n        if (runtimeAction && runtimeEventKey) {\n          await applyPetRuntimeCommandAward(env.DB, telegramId, `runtime:api:${runtimeEventKey}`, runtimeAction, {\n            drop_roll: body.drop_roll,\n            material_amount: body.material_amount,\n          });\n        }\n      }\n      return json({ ...result, pet: serializePet(result.pet) }, result.accepted ? 200 : 409);\n",
            'API runtime award hook',
          );

          replaceOnce(
            "  await savePetProfile(db, pet);\n  return { accepted: true, reason: 'shop_purchase', item, pet, xp_awarded: 0, pet_xp_awarded: 0 };\n}\n\nasync function processPetGoldTrade",
            "  await savePetProfile(db, pet);\n  await db.prepare(`INSERT INTO telegram_pet_equipment_progression (telegram_id, item_key, slot) VALUES (?, ?, ?) ON CONFLICT (telegram_id, item_key) DO UPDATE SET slot = excluded.slot, updated_at = CURRENT_TIMESTAMP`).bind(telegramId, item.key, item.slot).run();\n  return { accepted: true, reason: 'shop_purchase', item, pet, xp_awarded: 0, pet_xp_awarded: 0 };\n}\n\nasync function processPetGoldTrade",
            'shop progression upsert',
          );

          replaceOnce(
            "  const rows = await db.prepare(`SELECT item_key, slot, item_level, item_xp, mastery_xp, mastery_tier FROM telegram_pet_equipment_progression WHERE telegram_id = ? ORDER BY slot, item_level DESC, item_key`).bind(telegramId).all().catch(() => ({ results: [] }));\n",
            "  for (const slot of ['food', 'toy', 'outfit', 'armor', 'weapon', 'charm']) {\n    const itemKey = String(pet[`equipped_${slot}`] || '').trim();\n    if (!itemKey) continue;\n    await db.prepare(`INSERT OR IGNORE INTO telegram_pet_equipment_progression (telegram_id, item_key, slot) VALUES (?, ?, ?)`).bind(telegramId, itemKey, slot).run().catch(() => {});\n  }\n  const rows = await db.prepare(`SELECT item_key, slot, item_level, item_xp, mastery_xp, mastery_tier FROM telegram_pet_equipment_progression WHERE telegram_id = ? ORDER BY slot, item_level DESC, item_key`).bind(telegramId).all().catch(() => ({ results: [] }));\n",
            'gear read repair',
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Remove temporary patch workflow
        run: rm .github/workflows/phase5b-review-fixes.yml
      - name: Validate final Worker
        run: |
          node --check workers/moonboys-api/worker.js
          npm install
          npm run ci:worker-api
      - name: Commit final hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/moonboys-api/worker.js .github/workflows/phase5b-review-fixes.yml
          git commit -m "Complete Phase 5 pet runtime integration"
          git push origin HEAD:agent/pets-phase-5-final-hotfix
