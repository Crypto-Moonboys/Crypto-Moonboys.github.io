name: One-shot Arcade Runtime Fix

on:
  push:
    branches:
      - agent/rename-arcade-original-brands

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rename-arcade-original-brands
          fetch-depth: 0

      - name: Apply canonical Arcade IDs
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('workers/leaderboard-worker.js')
          text = worker.read_text(encoding='utf-8')
          text = text.replace(
              'const GAMES = ["snake", "blocktopia", "invaders", "pacchain", "asteroids", "breakout", "tetris", "kaiju"];',
              'const GAMES = ["snake", "blocktopia", "meme-swarm-3008", "chain-maze", "forkfield", "bullrun-brick-smash", "block-topia-dropzone", "kaiju"];'
          )
          text = text.replace(
              'const VARIETY_BONUS_GAMES = ["snake", "blocktopia", "invaders", "pacchain", "asteroids", "breakout", "tetris"];',
              'const VARIETY_BONUS_GAMES = ["snake", "blocktopia", "meme-swarm-3008", "chain-maze", "forkfield", "bullrun-brick-smash", "block-topia-dropzone"];'
          )
          text = text.replace(
              "  'breakout-bullrun':    'breakout',\n  'asteroid-fork':       'asteroids',\n  'pac-chain':           'pacchain',\n  'tetris-block-topia':  'tetris',",
              "  'invaders-3008':       'meme-swarm-3008',\n  'breakout-bullrun':    'bullrun-brick-smash',\n  'asteroid-fork':       'forkfield',\n  'pac-chain':           'chain-maze',\n  'tetris-block-topia':  'block-topia-dropzone',"
          )
          worker.write_text(text, encoding='utf-8')

          ui = Path('js/arcade-leaderboard.js')
          text = ui.read_text(encoding='utf-8')
          replacements = {
              "{ key: 'invaders',   label: '👾 Invaders',    icon: '👾' }": "{ key: 'meme-swarm-3008', label: '👾 Meme Swarm 3008', icon: '👾' }",
              "{ key: 'pacchain',   label: '🟡 Pac-Chain',   icon: '🟡' }": "{ key: 'chain-maze', label: '🟡 Chain Maze', icon: '🟡' }",
              "{ key: 'asteroids',  label: '🌑 Asteroids',   icon: '🌑' }": "{ key: 'forkfield', label: '🌑 Forkfield', icon: '🌑' }",
              "{ key: 'breakout',   label: '🧱 Bullrun',     icon: '🧱' }": "{ key: 'bullrun-brick-smash', label: '🧱 Bullrun Brick Smash', icon: '🧱' }",
              "{ key: 'tetris',     label: '🟦 Tetris',      icon: '🟦' }": "{ key: 'block-topia-dropzone', label: '🟦 Block Topia Dropzone', icon: '🟦' }",
              "  invaders:   '👾 Invaders',": "  'meme-swarm-3008': '👾 Meme Swarm 3008',",
              "  pacchain:   '🟡 Pac-Chain',": "  'chain-maze': '🟡 Chain Maze',",
              "  asteroids:  '🌑 Asteroids',": "  forkfield: '🌑 Forkfield',",
              "  breakout:   '🧱 Bullrun',": "  'bullrun-brick-smash': '🧱 Bullrun Brick Smash',",
              "  tetris:     '🟦 Tetris',": "  'block-topia-dropzone': '🟦 Block Topia Dropzone',",
              "const BREAKDOWN_GAMES = ['snake', 'blocktopia', 'invaders', 'pacchain', 'asteroids', 'breakout', 'tetris', 'kaiju'];": "const BREAKDOWN_GAMES = ['snake', 'blocktopia', 'meme-swarm-3008', 'chain-maze', 'forkfield', 'bullrun-brick-smash', 'block-topia-dropzone', 'kaiju'];",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected leaderboard UI marker: {old}')
              text = text.replace(old, new)
          ui.write_text(text, encoding='utf-8')

          forkfield = Path('js/arcade/games/asteroid-fork/bootstrap.js')
          text = forkfield.read_text(encoding='utf-8')
          old = "const GAME_ID = 'asteroids';"
          new = 'const GAME_ID = ASTEROID_FORK_CONFIG.id;'
          if old not in text:
              raise SystemExit('Missing Forkfield GAME_ID marker')
          forkfield.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Guard against accidental retention of retired score IDs in canonical UI/worker constants.
          worker_head = worker.read_text(encoding='utf-8')[:2500]
          for retired in ['"invaders"', '"pacchain"', '"asteroids"', '"breakout"', '"tetris"']:
              if retired in worker_head.split('const CANONICAL_FACTIONS', 1)[0]:
                  raise SystemExit(f'Retired canonical worker ID remains: {retired}')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-arcade-runtime-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/leaderboard-worker.js js/arcade-leaderboard.js js/arcade/games/asteroid-fork/bootstrap.js .github/workflows/fix-arcade-runtime-once.yml
          git commit -m "Complete Arcade runtime namespace rename"
          git push origin HEAD:agent/rename-arcade-original-brands
