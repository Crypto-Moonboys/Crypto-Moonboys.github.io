name: NBG London Level 1 Browser Validation

on:
  pull_request:
    paths:
      - game/nbg-level1.js
      - game/nbg-london-leaderboards.js
      - games/nbg-london/index.html
      - game/assets/**
      - workers/leaderboard/nbg-london-records.js
      - workers/leaderboard/nbg-london-replay.js
      - workers/leaderboard/nbg-london-prizes.js
      - workers/leaderboard/deployment-entry.js
      - workers/leaderboard-worker.js
      - workers/moonboys-api/migrations/098_nbg_london_records.sql
      - workers/moonboys-api/migrations/099_nbg_london_competition_prizes.sql
      - workers/leaderboard/wrangler.toml
      - scripts/nbg-london-records.test.mjs
      - scripts/nbg-london-replay.test.mjs
      - scripts/nbg-london-client-auth.test.mjs
      - scripts/nbg-level1-browser-validation.mjs
      - scripts/verify-nbg-pages-worker-course.mjs
      - scripts/verify-nbg-pages-worker-course.test.mjs
      - scripts/ci-change-scope.mjs
      - .github/workflows/pages.yml
      - .github/workflows/nbg-level1-browser.yml
  push:
    branches: [main]
    paths:
      - game/nbg-level1.js
      - game/nbg-london-leaderboards.js
      - games/nbg-london/index.html
      - game/assets/**
      - workers/leaderboard/nbg-london-records.js
      - workers/leaderboard/nbg-london-replay.js
      - workers/leaderboard/nbg-london-prizes.js
      - workers/leaderboard/deployment-entry.js
      - workers/leaderboard-worker.js
      - workers/moonboys-api/migrations/098_nbg_london_records.sql
      - workers/moonboys-api/migrations/099_nbg_london_competition_prizes.sql
      - workers/leaderboard/wrangler.toml
      - scripts/nbg-london-records.test.mjs
      - scripts/nbg-london-replay.test.mjs
      - scripts/nbg-london-client-auth.test.mjs
      - scripts/nbg-level1-browser-validation.mjs
      - scripts/verify-nbg-pages-worker-course.mjs
      - scripts/verify-nbg-pages-worker-course.test.mjs
      - scripts/ci-change-scope.mjs
      - .github/workflows/pages.yml
      - .github/workflows/nbg-level1-browser.yml

permissions:
  contents: read

jobs:
  level1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check game/nbg-level1.js
      - run: node --check game/nbg-london-leaderboards.js
      - run: node --check workers/leaderboard/nbg-london-records.js
      - run: node --check workers/leaderboard/nbg-london-replay.js
      - run: node --check workers/leaderboard/nbg-london-prizes.js
      - run: node --check workers/leaderboard/deployment-entry.js
      - run: node --check scripts/nbg-level1-browser-validation.mjs
      - run: node --test scripts/nbg-london-records.test.mjs
      - run: node --test scripts/nbg-london-replay.test.mjs
      - run: node --test scripts/nbg-london-client-auth.test.mjs
      - run: node --test scripts/verify-nbg-pages-worker-course.test.mjs
      - name: Validate complete Level 1 three consecutive times
        run: |
          for attempt in 1 2 3; do
            echo "NBG Level 1 validation attempt $attempt/3"
            npm run test:nbg-level1
          done
