name: NBG London Level 1 Browser Validation

# Routine checks are opt-in. See AGENTS.md and docs/ci-workflow-policy.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check game/nbg-level1.js
      - run: node --check game/nbg-audio.js
      - run: node --check game/nbg-london-leaderboards.js
      - run: node --check workers/moonboys-api/telegram-group-membership.js
      - run: node --check workers/leaderboard/nbg-london-records.js
      - run: node --check workers/leaderboard/nbg-london-replay.js
      - run: node --check workers/leaderboard/nbg-london-prizes.js
      - run: node --check workers/leaderboard/deployment-entry.js
      - run: node --check scripts/nbg-level1-browser-validation.mjs
      - run: node scripts/nbg-hd-render-contract.test.mjs
      - run: node --test scripts/nbg-audio-contract.test.mjs
      - run: node --test scripts/nbg-london-records.test.mjs
      - run: node --test scripts/nbg-london-replay.test.mjs
      - run: node --test scripts/nbg-london-client-auth.test.mjs
      - run: node --test scripts/nbg-telegram-group-membership.test.mjs
      - run: node --test scripts/nbg-telegram-access-gate-client.test.mjs
      - run: node --test scripts/verify-nbg-pages-worker-course.test.mjs
      - run: node --test scripts/verify-nbg-group-gate-worker.test.mjs
      - name: Validate complete Level 1 three consecutive times
        run: |
          for attempt in 1 2 3; do
            echo "NBG Level 1 validation attempt $attempt/3"
            npm run test:nbg-level1
          done
