name: One-time SPARKY Public Wiki Sync

on:
  push:
    branches:
      - feature/sparky-complete-creator-studio-20261010
    paths:
      - '.github/workflows/sparky-public-wiki-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Crypto-Moonboys/Crypto-Moonboys.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Regenerate reference inventory and derived public discovery
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node scripts/wiki-publish-gate.js
          node scripts/generate-publishing-surfaces.mjs
          node scripts/generate-wiki-content-state.mjs
          node scripts/generate-wiki-content-state.mjs --check
          node scripts/audit-manual-content-preservation.mjs
          git add -- brand-canon/wiki-content-state.json brand-canon/wiki-rewrite-audit.md js/wiki-publish-audit.json js/wiki-index.json js/link-map.json js/link-graph.json js/entity-map.json js/entity-graph.json js/graph-data.json js/entity-graph-lite.json js/site-stats.json sitemap.xml index_stats.json sam-memory.json
          if git diff --cached --quiet; then echo "Generated records already match"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Moonboy creator ownership and wiki discovery"
          git push origin HEAD:feature/sparky-complete-creator-studio-20261010
