name: Temporary P1 canon rewrite refresh
# rerun after GraffPUNKS canonical casing fix

on:
  push:
    branches:
      - canon/rewrite-p1-core-lore
    paths:
      - ".github/workflows/refresh-p1-canon-rewrite.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rewrite branch
        uses: actions/checkout@v4
        with:
          ref: canon/rewrite-p1-core-lore
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh content state and publishing surfaces
        env:
          BASE_SHA: 09290c45a410aade863770c34ff12835ce99d182
          HEAD_SHA: ${{ github.sha }}
          CANON_PROSE_CHANGE_APPROVED: "1"
        shell: bash
        run: |
          node scripts/generate-wiki-content-state.mjs
          node scripts/wiki-publish-gate.js
          for pass in 1 2 3; do
            echo "Publishing convergence pass $pass"
            node scripts/generate-publishing-surfaces.mjs
          done
          node scripts/graph-publishing-integrity.test.mjs
          npm run ci:wiki

      - name: Commit refreshed canon state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            brand-canon/wiki-content-state.json \
            brand-canon/wiki-rewrite-audit.md \
            js/wiki-publish-audit.json \
            js/wiki-index.json \
            js/link-map.json \
            js/link-graph.json \
            js/entity-map.json \
            sam-memory.json \
            js/entity-graph.json \
            js/graph-data.json \
            js/entity-graph-lite.json \
            sitemap.xml \
            js/site-stats.json \
            index_stats.json
          if git diff --cached --quiet; then
            echo "Generated surfaces already current."
          else
            git commit -m "chore(canon): refresh P1 rewrite state and publishing surfaces"
            git push origin HEAD:canon/rewrite-p1-core-lore
          fi
