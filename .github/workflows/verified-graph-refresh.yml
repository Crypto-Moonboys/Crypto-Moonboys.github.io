name: Propose Verified Graph Refresh

on:
  workflow_dispatch:
  schedule:
    # Refresh opportunity twice daily; publishing still requires reviewed PR merge.
    - cron: '17 2,14 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verified-graph-refresh
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate canonical graph and publishing surfaces
        run: node scripts/generate-publishing-surfaces.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify source/index and full/mobile graph integrity
        run: node scripts/graph-publishing-integrity.test.mjs
      - name: Verify canonical graph generation is reproducible
        run: |
          cp js/graph-data.json "${RUNNER_TEMP}/verified-graph-data.json"
          cp js/entity-graph-lite.json "${RUNNER_TEMP}/verified-lite-graph.json"
          GRAPH_PUBLISHING_CHECK=1 node scripts/generate-publishing-surfaces.mjs
          cmp js/graph-data.json "${RUNNER_TEMP}/verified-graph-data.json"
          cmp js/entity-graph-lite.json "${RUNNER_TEMP}/verified-lite-graph.json"
          node scripts/graph-publishing-integrity.test.mjs
      - name: Propose only verified graph artifact changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/verified-graph-refresh
          delete-branch: true
          add-paths: |
            js/graph-data.json
            js/entity-graph-lite.json
          commit-message: 'chore(graph): refresh source-verified graph artifacts'
          title: 'chore: publish verified graph freshness'
          body: |
            The canonical graph generator was executed and verified against
            the Wiki index, relationship source, full graph and lite graph.
            Reproducibility was checked with GRAPH_PUBLISHING_CHECK=1.

            This PR is *not* an automatic release. Review diff and CI before
            merging. It does not modify gameplay, Worker/D1, rewards or identity.
            After merge verify Pages publication and rerun Live Site Verify.
          labels: |
            maintenance
