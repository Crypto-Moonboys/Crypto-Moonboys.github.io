name: SPARKY Creator Studio Handoff

# Routine checks are opt-in. See AGENTS.md and docs/ci-workflow-policy.md.
on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  smoke:
    name: All creator activity launch and public canon safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check new creator application JavaScript
        run: node --check js/sparky-creator-activities.js && node --check js/sparky-gpt-app.js && node --check js/creator-memory.js && node --check js/creator-memory-studio.js
      - name: Run all SPARKY creator regression tests
        run: node --test scripts/sparky-chatgpt-handoff.test.mjs scripts/creator-memory.test.mjs scripts/creator-memory-studio.interaction.test.mjs
      - name: Build the actual public Pages artifact
        run: node scripts/prepare-pages-artifact.mjs public-site
      - name: Verify deployed guides, canon index, wiki discovery and disclosure protection
        run: node --test scripts/sparky-pages-artifact.test.mjs
