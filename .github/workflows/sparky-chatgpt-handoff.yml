name: SPARKY Creator Studio Handoff

on:
  pull_request:
    paths:
      - 'gpt-users.html'
      - 'swarmsy.html'
      - 'sparky-chatgpt-guide.txt'
      - 'guides/sparky/**'
      - 'moonboy-ai-canon-guide.txt'
      - 'moonboy-canon-index.json'
      - 'wiki/create-your-moonboy.html'
      - 'js/sparky-creator-activities.js'
      - 'js/sparky-gpt-app.js'
      - 'js/creator-memory.js'
      - 'js/creator-memory-studio.js'
      - 'docs/portable-creator-memory.md'
      - 'scripts/creator-memory.test.mjs'
      - 'scripts/creator-memory-studio.interaction.test.mjs'
      - 'scripts/sparky-chatgpt-handoff.test.mjs'
      - 'scripts/sparky-pages-artifact.test.mjs'
      - 'scripts/fixtures/sparky-creator-goal-hashes.json'
      - 'scripts/prepare-pages-artifact.mjs'
      - 'scripts/generate-wiki-content-state.mjs'
      - '.github/workflows/sparky-chatgpt-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: All creator activity launch and public canon safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new creator application JavaScript
        run: node --check js/sparky-creator-activities.js && node --check js/sparky-gpt-app.js && node --check js/creator-memory.js && node --check js/creator-memory-studio.js
      - name: Run all SPARKY creator regression tests
        run: node --test scripts/sparky-chatgpt-handoff.test.mjs scripts/creator-memory.test.mjs scripts/creator-memory-studio.interaction.test.mjs
      - name: Build the actual public Pages artifact
        run: node scripts/prepare-pages-artifact.mjs public-site
      - name: Verify deployed guides, canon index, wiki discovery and disclosure protection
        run: node --test scripts/sparky-pages-artifact.test.mjs
