name: Production Deployment Truth

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify safe static PR changes
        id: fast_edit
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/fast-edit-scope.mjs

      - name: Fast Edit acknowledged
        if: steps.fast_edit.outputs.fast_edit == 'true'
        run: |
          echo "Static-only PR; unchanged deployment contract"

      - name: Test deployment truth rules
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/production-deployment-truth-audit.test.mjs

      - name: Audit production claims
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/production-deployment-truth-audit.mjs
