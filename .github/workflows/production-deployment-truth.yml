name: Production Deployment Truth

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify safe static PR changes
        id: fast_edit
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # Trust the protected base revision, never a contributor-modified PR file.
          if git cat-file -e "$BASE_SHA:scripts/fast-edit-scope.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/fast-edit-scope.mjs" > "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
            node "$RUNNER_TEMP/trusted-fast-edit-scope.mjs"
          else
            echo "fast_edit=false" >> "$GITHUB_OUTPUT"
            echo "No trusted classifier in base: performing complete deployment audit."
          fi

      - name: Fast Edit acknowledged
        if: steps.fast_edit.outputs.fast_edit == 'true'
        run: |
          echo "Static-only PR; unchanged deployment contract"

      - name: Test deployment truth rules
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/production-deployment-truth-audit.test.mjs

      - name: Audit production claims
        if: steps.fast_edit.outputs.fast_edit != 'true'
        run: node scripts/production-deployment-truth-audit.mjs
