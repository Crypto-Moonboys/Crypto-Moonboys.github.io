name: Production Deployment Truth

# Routine checks are opt-in. See AGENTS.md and docs/ci-workflow-policy.md.
on:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: production-deployment-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test deployment truth rules
        run: node scripts/production-deployment-truth-audit.test.mjs

      - name: Audit production claims
        run: node scripts/production-deployment-truth-audit.mjs
