name: Production Deployment Truth

on:
  pull_request:
    paths:
      - "workers/**"
      - "scripts/*worker*"
      - "deployments/**"
      - ".github/workflows/production-deployment-truth.yml"
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "scripts/*worker*"
      - "deployments/**"
      - ".github/workflows/production-deployment-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test deployment truth rules
        run: node scripts/production-deployment-truth-audit.test.mjs

      - name: Audit production claims
        run: node scripts/production-deployment-truth-audit.mjs
