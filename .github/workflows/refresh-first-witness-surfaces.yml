name: Temporary First Witness publishing refresh

on:
  push:
    branches:
      - canon/first-witness-bible-hub
    paths:
      - "wiki/the-first-witness.html"
      - "wiki/sacred-chain.html"
      - "brand-canon/approved-pages.json"
      - ".github/workflows/refresh-first-witness-surfaces.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: canon/first-witness-bible-hub
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh publish gate and public surfaces
        run: |
          node scripts/wiki-publish-gate.js
          node scripts/generate-publishing-surfaces.mjs
          node scripts/graph-publishing-integrity.test.mjs
          npm run ci:wiki

      - name: Commit regenerated surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/wiki-publish-audit.json \
            js/wiki-index.json \
            js/link-map.json \
            js/link-graph.json \
            js/entity-map.json \
            sam-memory.json \
            js/entity-graph.json \
            js/graph-data.json \
            js/entity-graph-lite.json \
            sitemap.xml \
            js/site-stats.json \
            index_stats.json
          if git diff --cached --quiet; then
            echo "Publishing surfaces already current."
          else
            git commit -m "chore(wiki): regenerate First Witness publishing surfaces"
            git push origin HEAD:canon/first-witness-bible-hub
          fi
