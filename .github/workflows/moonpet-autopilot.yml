name: Moonpet Art Integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "24 6 * * *"

jobs:
  moonpet-art-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax check current runtime
        run: |
          node --check js/moonpet-art-resolver.js
          node --check js/moonpet-bot-art-loader.js
          node --check js/moonpet-bot-art-renderer.js
          node --check js/moonpet-mini-app.js
          node --check scripts/discover-autosprite-character.js
          node --check scripts/generate-botty-front-animations.js
          node --check scripts/download-botty-front-animations.js
          node --check scripts/promote-moonpet-bot-front-pack.js
      - name: Validate current art architecture
        run: |
          node scripts/moonpet-art-architecture.test.mjs
          node scripts/moonpet-multi-bot-art.test.mjs
          node scripts/telegram-pets-mini-app.test.mjs
