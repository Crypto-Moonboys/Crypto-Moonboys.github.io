name: PR template check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read
  contents: read

jobs:
  validate-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR template sections
        run: |
          node <<'NODE'
          const fs = require('fs');

          const eventPath = process.env.GITHUB_EVENT_PATH;
          const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
          const body = event?.pull_request?.body || '';
          const errors = [];

          const requiredHeadings = [
            '# Summary',
            '# Scope lock',
            '# Files changed',
            '# Runtime impact',
            '# Deploy notes',
            '# Tests run',
            '# Live verification needed',
            '# Anti-drift checklist',
            '# Merge decision'
          ];

          for (const heading of requiredHeadings) {
            if (!body.includes(heading)) {
              errors.push(`Missing required heading: ${heading}`);
            }
          }

          const deployFields = [
            'Worker deploy required',
            'D1 migration required',
            'VPS restart required',
            'GitHub Pages only'
          ];

          for (const field of deployFields) {
            const fieldRegex = new RegExp(
              `(?:^|\\n)\\s*[-*]?\\s*${field.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}:\\s*(Yes|No)\\s*(?:\\n|$)`,
              'i'
            );
            if (!fieldRegex.test(body)) {
              errors.push(`Deploy notes must set "${field}:" to explicit Yes or No.`);
            }
          }

          const testsMatch = body.match(/(?:^|\n)# Tests run[^\n]*\n([\s\S]*?)(?=\n# [^\n]+|$)/i);
          const testsSection = testsMatch ? testsMatch[1].trim() : '';

          const testsEvidence = testsSection
            .replace(/^\s*Paste exact commands and results:\s*$/gim, '')
            .replace(/^\s*[-*]\s*\[\s\]\s*git diff --check\s*$/gim, '')
            .replace(/^\s*[-*]\s*\[\s\]\s*node --check changed JS files\s*$/gim, '')
            .replace(/^\s*[-*]\s*\[\s\]\s*npm test\s*$/gim, '')
            .replace(/^\s*[-*]\s*\[\s\]\s*other:\s*$/gim, '')
            .trim();

          const hasCheckedTestItem = /(?:^|\n)\s*[-*]\s*\[[xX]\]\s*(git diff --check|node --check changed JS files|npm test|other:)/.test(testsSection);
          const hasTestsEvidence = testsEvidence.length > 0 || hasCheckedTestItem;
          if (!hasTestsEvidence) {
            errors.push('Tests run section is empty. Include test evidence.');
          }

          const hasNpmTest =
            /(?:^|\n)\s*[-*]\s*\[[xX]\]\s*npm test\b/i.test(testsSection) ||
            /(?:^|\n)\s*`?npm test`?\s*(?:$|\n)/i.test(testsSection) ||
            /\bnpm test\b.+/i.test(testsSection);
          const hasNpmNotRequiredExplanation =
            /\bnpm\s+test\b[\s\S]{0,200}\bnot\s+required\b/i.test(testsSection) ||
            /\bnot\s+required\b[\s\S]{0,200}\bnpm\s+test\b/i.test(testsSection);

          if (!hasNpmTest && !hasNpmNotRequiredExplanation) {
            errors.push('Tests run section must include "npm test" or explain why npm test was not required.');
          }

          if (errors.length) {
            console.error('PR template validation failed:');
            for (const error of errors) {
              console.error(`- ${error}`);
            }
            process.exit(1);
          }

          console.log('PR template validation passed.');
          NODE
