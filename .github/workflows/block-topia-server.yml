name: Block Topia Server

# Routine checks are opt-in. See AGENTS.md and docs/ci-workflow-policy.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/block-topia
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/block-topia/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - name: Validate patched dependency lockfiles
        run: node scripts/security-dependency-check.mjs
        working-directory: .
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
        working-directory: .
      - run: node scripts/blocktopia-client-browser.test.mjs
        working-directory: .
