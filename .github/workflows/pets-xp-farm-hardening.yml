name: Pets XP Farm Hardening

on:
  push:
    branches:
      - agent/pets-xp-farm-hardening
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/pets-xp-farm-hardening' || github.ref_name == 'agent/pets-xp-farm-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pets-xp-farm-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply hardening patch
        run: node scripts/apply-pets-xp-farm-hardening.mjs

      - name: Validate Worker syntax
        run: node --check workers/moonboys-api/worker.js

      - name: Run Pets API regression suite
        run: node scripts/telegram-pets-api.test.mjs

      - name: Run Worker/API CI
        run: npm run ci:worker-api

      - name: Remove one-shot patch tooling
        run: |
          rm scripts/apply-pets-xp-farm-hardening.mjs
          rm .github/workflows/pets-xp-farm-hardening.yml

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Crypto Moonboy Pets XP farming"
          git push origin HEAD:agent/pets-xp-farm-hardening
