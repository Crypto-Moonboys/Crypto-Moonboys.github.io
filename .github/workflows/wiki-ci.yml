name: Wiki Structure Enforcement

on:
  pull_request:
    paths:
      - "wiki/**"
      - "js/site-shell.js"
      - "js/wiki.js"
      - "js/wiki-index.json"
      - "js/wiki-search-synonyms.json"
      - "js/wiki-publish-audit.json"
      - "js/related-wiki-paths.json"
      - "js/website-publish-payloads.json"
      - "css/**"
      - "**/*.html"
      - "scripts/root-pages-config.js"
      - "scripts/wiki-publish-gate.js"
      - "scripts/wiki-aliases.js"
      - "scripts/wiki-brand-taxonomy.js"
      - ".github/workflows/wiki-ci.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Wiki Structure Validator
        run: npm run test:wiki-structure

      - name: Block merge if invalid
        if: failure()
        run: |
          echo "❌ Wiki CI FAILED: Swarmsy system violation detected"
          exit 1
