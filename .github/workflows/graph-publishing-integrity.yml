name: Graph Publishing Integrity

on:
  pull_request:
    paths:
      - "wiki/**"
      - "brand-canon/**"
      - "categories/**"
      - "data/**"
      - "js/**"
      - "assets/**"
      - "og-templates/**"
      - "about.html"
      - "hubs.html"
      - "sam.html"
      - "sitemap.xml"
      - "index_stats.json"
      - "sam-memory.json"
      - "scripts/**"
      - ".github/workflows/graph-publishing-integrity.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "brand-canon/**"
      - "categories/**"
      - "data/**"
      - "js/**"
      - "assets/**"
      - "og-templates/**"
      - "about.html"
      - "hubs.html"
      - "sam.html"
      - "sitemap.xml"
      - "index_stats.json"
      - "sam-memory.json"
      - "scripts/**"
      - ".github/workflows/graph-publishing-integrity.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: graph-publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Regenerate public publishing surfaces
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/generate-publishing-surfaces.mjs

      - name: Verify graph and index parity
        run: node scripts/graph-publishing-integrity.test.mjs

      - name: Validate regenerated wiki surfaces
        run: npm run ci:wiki

      - name: Fail on stale generated publishing surfaces
        run: |
          if ! git diff --exit-code -- \
            js/wiki-index.json \
            js/link-map.json \
            js/link-graph.json \
            js/entity-map.json \
            js/entity-graph.json \
            js/graph-data.json \
            js/entity-graph-lite.json \
            js/site-stats.json \
            sitemap.xml \
            index_stats.json \
            sam-memory.json; then
            echo "Publishing surfaces are stale. Run node scripts/generate-publishing-surfaces.mjs and commit the generated outputs."
            git diff --stat
            exit 1
          fi

      - name: Show generated surface changes
        if: always()
        run: git diff --stat
