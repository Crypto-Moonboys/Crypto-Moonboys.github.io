name: Graph Publishing Integrity

on:
  pull_request:
    paths:
      - "js/**"
      - "!js/arcade/**"
      - "css/**"
      - "*.html"
      - "wiki/**"
      - "scripts/generate-*.js"
      - "scripts/generate-publishing-surfaces.mjs"
      - "scripts/apply-wiki-search-synonyms.mjs"
      - "scripts/graph-publishing-integrity.test.mjs"
      - ".github/workflows/graph-publishing-integrity.yml"
  push:
    branches: [main]
    paths:
      - "js/**"
      - "!js/arcade/**"
      - "css/**"
      - "*.html"
      - "wiki/**"
      - "scripts/generate-*.js"
      - "scripts/generate-publishing-surfaces.mjs"
      - "scripts/apply-wiki-search-synonyms.mjs"
      - "scripts/graph-publishing-integrity.test.mjs"
      - ".github/workflows/graph-publishing-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate public publishing surfaces
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/generate-publishing-surfaces.mjs

      - name: Verify graph and index parity
        run: node scripts/graph-publishing-integrity.test.mjs

      - name: Validate regenerated wiki surfaces
        run: npm run ci:wiki

      - name: Show generated surface changes
        if: always()
        run: git diff --stat
