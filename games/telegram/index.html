<head>

  <style>
    :root {
      color-scheme: dark;
      --cabinet: #07101c;
      --cabinet-edge: #172842;
      --screen: #030812;
      --cyan: #22d7ff;
      --pink: #ff3fd9;
      --green: #32ff62;
      --gold: #ffd15c;
      --red: #ff413d;
      --purple: #a14cff;
      --orange: #ff9b22;
      --pixel-font: "Courier New", "Lucida Console", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 215, 255, .18), transparent 32rem),
        radial-gradient(circle at 15% 24%, rgba(255, 63, 217, .16), transparent 20rem),
        linear-gradient(180deg, #010307 0%, #05070a 55%, #010204 100%);
      color: #f6f8ff;
      font-family: var(--pixel-font);
      overflow-x: hidden;
      image-rendering: pixelated;
    }
    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
    }
    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px),
        linear-gradient(90deg, transparent, rgba(34,215,255,.045), transparent);
      mix-blend-mode: screen;
      opacity: .38;
    }
    main {
      position: relative;
      width: min(520px, 100%);
      min-height: min(760px, calc(100dvh - 28px));
      border: 2px solid #26466f;
      border-radius: 6px;
      padding: 22px 16px 18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.09), transparent 18%),
        radial-gradient(circle at 50% 0%, rgba(34, 215, 255, .13), transparent 18rem),
        linear-gradient(180deg, #101b2c 0%, var(--cabinet) 54%, #040910 100%);
      box-shadow:
        0 0 0 4px rgba(0,0,0,.55),
        inset 0 0 0 2px rgba(255,255,255,.045),
        inset 0 -22px 46px rgba(0,0,0,.48),
        0 0 28px rgba(34, 215, 255, .2);
      overflow: hidden;
    }
    main::before,
    main::after {
      position: absolute;
      top: 13px;
      width: 64px;
      height: 8px;
      content: "";
    }
    main::before {
      left: 18px;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan), 0 0 38px var(--cyan);
    }
    main::after {
      right: 18px;
      background: var(--pink);
      box-shadow: 0 0 18px var(--pink), 0 0 38px var(--pink);
    }
    .marquee {
      position: relative;
      z-index: 1;
      margin: 14px 0 16px;
      padding: 18px 12px 15px;
      border: 2px solid #18365d;
      border-radius: 4px;
      background:
        radial-gradient(circle at 50% 0%, rgba(34,215,255,.18), transparent 70%),
        linear-gradient(180deg, #071327 0%, #020610 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.035),
        inset 0 0 32px rgba(34,215,255,.12),
        6px 6px 0 rgba(0,0,0,.42);
      text-align: center;
    }
    .kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--cyan);
      font-family: var(--pixel-font);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0 #001b2a;
    }
    h1 {
      margin: 0;
      color: var(--gold);
      font-family: var(--pixel-font);
      font-size: clamp(25px, 8.4vw, 42px);
      line-height: .92;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow:
        3px 0 0 #9a4d00,
        0 3px 0 #9a4d00,
        3px 3px 0 #4c2500;
    }
    h1 span {
      display: block;
      margin-top: 6px;
      color: #ff65df;
      font-family: var(--pixel-font);
      font-size: .62em;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #67145a;
    }
    p { margin: 8px 0; color: #c8d6ec; line-height: 1.4; }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 14px;
      border: 2px solid #0d6f2c;
      border-radius: 3px;
      padding: 9px 11px;
      background: #041f0d;
      box-shadow: inset 0 0 0 2px rgba(50,255,98,.08), 4px 4px 0 rgba(0,0,0,.36);
    }
    .status-bar::before {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      content: "";
      background: var(--green);
      box-shadow: 3px 3px 0 #001c08;
    }
    .status-lamps {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
    }
    .status-lamps i {
      width: 10px;
      height: 10px;
      background: var(--green);
      box-shadow: 2px 2px 0 #001c08;
    }
    .screen-copy {
      margin: 0 0 14px;
      color: #8fd3ff;
      font-family: var(--pixel-font);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }
    nav { display: grid; gap: 10px; margin-top: 12px; }
    a {
      --accent: var(--cyan);
      --accent-glow: rgba(34, 215, 255, .42);
      --accent-border: #22d7ff;
      position: relative;
      display: grid;
      grid-template-columns: 58px 1fr 24px;
      align-items: center;
      gap: 11px;
      min-height: 68px;
      border: 2px solid var(--accent-border);
      border-radius: 3px;
      padding: 8px 10px;
      background:
        linear-gradient(90deg, var(--accent-glow), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.18)),
        #081326;
      color: #f6f8ff;
      font-family: var(--pixel-font);
      font-size: clamp(15px, 4.3vw, 21px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      text-decoration: none;
      text-shadow: 2px 2px 0 #020305;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.025),
        inset 0 -8px 0 rgba(0,0,0,.24),
        5px 5px 0 rgba(0,0,0,.48);
      -webkit-tap-highlight-color: transparent;
      transform: translateZ(0);
    }
    a::before {
      display: grid;
      place-items: center;
      width: 56px;
      height: 48px;
      border: 2px solid var(--accent-border);
      border-radius: 2px;
      content: attr(data-icon);
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.28)),
        #050a12;
      color: var(--accent);
      font-family: var(--pixel-font);
      font-size: 14px;
      font-weight: 900;
      box-shadow: inset 0 -7px 0 rgba(0,0,0,.32), 3px 3px 0 rgba(0,0,0,.5);
    }
    a::after {
      justify-self: end;
      content: ">";
      color: var(--accent);
      font-family: var(--pixel-font);
      font-size: 31px;
      line-height: 1;
      text-shadow: 2px 2px 0 #020305;
    }
    a[data-tone="red"] { --accent: var(--red); --accent-border: #ff413d; --accent-glow: rgba(255,65,61,.42); }
    a[data-tone="purple"] { --accent: var(--purple); --accent-border: #a14cff; --accent-glow: rgba(161,76,255,.42); }
    a[data-tone="green"] { --accent: var(--green); --accent-border: #32ff62; --accent-glow: rgba(50,255,98,.42); }
    a[data-tone="orange"] { --accent: var(--orange); --accent-border: #ff9b22; --accent-glow: rgba(255,155,34,.42); }
    a:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.025),
        inset 0 9px 18px rgba(0,0,0,.28),
        2px 2px 0 rgba(0,0,0,.48);
    }
    body.is-initializing nav a,
    body.is-navigating nav a { opacity:.58; pointer-events:none; }
    body.is-navigating nav a.is-launching { opacity:1; }
    .version {
      margin: 14px 0 0;
      border: 1px solid #263f62;
      border-radius: 3px;
      padding: 9px 10px;
      background: #03070d;
      box-shadow: inset 0 0 16px rgba(255,209,92,.08);
    }
    code {
      color: var(--gold);
      font-family: var(--pixel-font);
      font-size: 12px;
      font-weight: 900;
      word-break: break-word;
      text-shadow: 0 0 8px rgba(255,209,92,.42);
    }
    .ok { color: var(--green); font-family: var(--pixel-font); font-weight: 900; text-shadow: 2px 2px 0 #001c08; }
    .control-deck {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(143, 211, 255, .18);
    }
    .coin-slot {
      border: 2px solid #263f62;
      border-radius: 3px;
      padding: 10px;
      background: linear-gradient(180deg, #0d1726, #04070c);
      color: var(--gold);
      font-family: var(--pixel-font);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      text-shadow: 2px 2px 0 #301c00;
    }
    .buttons {
      display: flex;
      align-items: end;
      gap: 10px;
    }
    .stick {
      width: 42px;
      height: 42px;
      border: 2px solid #ff807d;
      background: var(--red);
      box-shadow: 0 7px 0 #09111c, 4px 4px 0 rgba(0,0,0,.45);
    }
    .button-light {
      width: 28px;
      height: 28px;
      border: 2px solid #ffe8a0;
      background: var(--gold);
      box-shadow: 0 5px 0 #09111c, 3px 3px 0 rgba(0,0,0,.45);
    }
    @media (max-width: 420px) {
      body { padding-left: 8px; padding-right: 8px; }
      main { min-height: calc(100dvh - 18px); padding: 20px 10px 12px; border-radius: 5px; }
      .marquee { margin-top: 12px; padding: 15px 9px 13px; }
      a { grid-template-columns: 50px 1fr 20px; min-height: 62px; gap: 8px; padding: 8px; }
      a::before { width: 46px; height: 42px; font-size: 12px; }
      a::after { font-size: 28px; }
      .control-deck { grid-template-columns: 1fr auto; gap: 10px; }
      .coin-slot { padding: 8px 6px; font-size: 11px; }
      .stick { width: 34px; height: 34px; }
      .button-light { width: 23px; height: 23px; }
    }
  </style>
</head>
<body class="page-standalone-tool is-initializing" aria-busy="true">
  <main id="launcherRoot" aria-busy="true">

      <span class="kicker">28 BIT ARCADE</span>
      <h1>Crypto Moonboys <span>Games</span></h1>
    </section>
    <p class="status-bar"><span class="ok" id="launchStatus" role="status" aria-live="polite">Preparing games...</span><span class="status-lamps" aria-hidden="true"><i></i><i></i><i></i></span></p>
    <p class="screen-copy">Select game cartridge</p>

      <a href="/moonpet-game.html?v=20260814-moonpet-aaa-pass" data-icon="PET" aria-disabled="true" tabindex="-1">Moonpet OS</a>

    </nav>
    <p class="version"><code>/games/telegram/?v=20260903-games-shell-v8</code></p>
    <div class="control-deck" aria-hidden="true">

      <div class="buttons"><span class="stick"></span><span class="button-light"></span></div>
    </div>
  </main>
  <script>
    (function () {
      var FALLBACK_READY_MS = 1200;
      var INIT_DATA_STORAGE_KEY = 'moonboys.telegram.initData';
      var root = document.getElementById('launcherRoot');
      var status = document.getElementById('launchStatus');
      var links = Array.prototype.slice.call(document.querySelectorAll('nav a[href]'));
      var telegramApp = window.Telegram && window.Telegram.WebApp;
      var viewportStable = false;
      var navigationEnabled = false;
      var navigationStarted = false;
      var fallbackTimer = null;
      var cachedInitData = readTelegramInitData();

      function setBusy(isBusy) {
        document.body.classList.toggle('is-initializing', isBusy);
        document.body.setAttribute('aria-busy', isBusy ? 'true' : 'false');
        if (root) root.setAttribute('aria-busy', isBusy ? 'true' : 'false');
      }

      function setStatus(copy) {
        if (status) status.textContent = copy;
      }

      function setLinksEnabled(enabled) {
        links.forEach(function (link) {
          if (enabled) {
            link.removeAttribute('aria-disabled');
            link.removeAttribute('tabindex');
          } else {
            link.setAttribute('aria-disabled', 'true');
            link.setAttribute('tabindex', '-1');
          }
        });
      }

      function enableNavigation() {
        if (navigationEnabled) return;
        viewportStable = true;
        navigationEnabled = true;
        if (fallbackTimer !== null) {
          window.clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
        setBusy(false);
        setLinksEnabled(true);
        setStatus('Launcher loaded.');
      }

      function readHashInitData() {
        var rawHash = window.location.hash ? window.location.hash.slice(1) : '';
        if (!rawHash) return '';
        try {
          var params = new URLSearchParams(rawHash);
          return params.get('tgWebAppData') || '';
        } catch (_) {
          return '';
        }
      }

      function readTelegramInitData() {
        var initData = '';
        try {
          initData = telegramApp && telegramApp.initData ? String(telegramApp.initData) : '';
        } catch (_) {
          initData = '';
        }
        if (!initData) initData = readHashInitData();
        if (initData) {
          try {
            window.sessionStorage.setItem(INIT_DATA_STORAGE_KEY, initData);
          } catch (_) {}
        } else {
          try {
            initData = window.sessionStorage.getItem(INIT_DATA_STORAGE_KEY) || '';
          } catch (_) {
            initData = '';
          }
        }
        return initData;
      }

      function appendLauncherQuery(destination) {
        var currentParams = new URLSearchParams(window.location.search);
        currentParams.forEach(function (value, key) {
          if (key === 'tgWebAppData') return;
          if (!destination.searchParams.has(key)) destination.searchParams.append(key, value);
        });
      }

      function buildDestination(link) {
        var currentOrigin = new URL(window.location.origin);
        var destination = new URL(link.getAttribute('href'), currentOrigin.href);
        if (destination.host !== currentOrigin.host) destination = new URL('/', currentOrigin.href);
        destination.protocol = 'https:';
        destination.searchParams.delete('tgWebAppData');
        appendLauncherQuery(destination);
        if (cachedInitData) {
          destination.hash = 'tgWebAppData=' + encodeURIComponent(cachedInitData);
        }
        return destination.href;
      }

      function handleLaunch(event) {
        var link = event.currentTarget;
        event.preventDefault();
        if (!navigationEnabled || !viewportStable || navigationStarted) return;
        navigationStarted = true;
        document.body.classList.add('is-navigating');
        setLinksEnabled(false);
        link.classList.add('is-launching');
        setStatus('Opening game...');
        window.location.assign(buildDestination(link));
      }

      function onViewportChanged(event) {
        if (event && event.isStateStable === true) enableNavigation();
      }

      window.addEventListener('pageshow', function () {
        navigationStarted = false;
        document.body.classList.remove('is-navigating');
        links.forEach(function (link) { link.classList.remove('is-launching'); });
        if (viewportStable) {
          navigationEnabled = false;
          enableNavigation();
        }
      });

      links.forEach(function (link) {
        link.addEventListener('click', handleLaunch);
      });
      setLinksEnabled(false);
      setBusy(true);
      setStatus('Preparing games...');

      try {
        if (telegramApp) telegramApp.onEvent('viewportChanged', onViewportChanged);
      } catch (_) {}
      try {
        if (telegramApp) telegramApp.ready();
      } catch (_) {}
      try {
        if (telegramApp) telegramApp.expand();
      } catch (_) {}

      fallbackTimer = window.setTimeout(enableNavigation, FALLBACK_READY_MS);
    }());
  </script>
