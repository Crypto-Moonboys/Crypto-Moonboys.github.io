      <a data-mini-link href="/moonpet-game.html?v=20260814-moonpet-aaa-pass">Moonpet OS</a>

  </main>
  <script>
    (function () {
      var env = document.getElementById('env');
      var hasTg = !!(window.Telegram && window.Telegram.WebApp);
      var initData = '';
      var hashData = '';

      try {
        initData = hasTg && window.Telegram.WebApp.initData ? window.Telegram.WebApp.initData : '';
      } catch (_) {}

      try {
        hashData = new URLSearchParams(String(location.hash || '').replace(/^#/, '')).get('tgWebAppData') || '';
      } catch (_) {}

      var tgWebAppData = initData || hashData || '';
      if (tgWebAppData) {
        try { sessionStorage.setItem('moonboys_tg_web_app_data', tgWebAppData); } catch (_) {}
      }

      function appendTelegramData(href) {
        var url;
        try {
          url = new URL(href, location.origin);
        } catch (_) {
          return href;
        }
        if (url.origin !== location.origin || !tgWebAppData) return href;
        var hash = new URLSearchParams(String(url.hash || '').replace(/^#/, ''));
        hash.set('tgWebAppData', tgWebAppData);
        return url.pathname + url.search + '#' + hash.toString();
      }

      document.querySelectorAll('[data-mini-link]').forEach(function (link) {
        link.href = appendTelegramData(link.getAttribute('href'));
      });

      var initLen = 0;
      try { initLen = initData ? initData.length : 0; } catch (_) {}
      env.textContent = hasTg ? 'Telegram SDK detected. initData length: ' + initLen : 'Telegram SDK not detected. Browser preview mode.';
    }());
  </script>
