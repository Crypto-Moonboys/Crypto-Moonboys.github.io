<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina’s Waterfront | Block Topia</title>
<style>
:root{color-scheme:dark;background:#0d151e;color:#e9f4ed;font:1rem system-ui,sans-serif}
body{margin:0}main{max-width:66rem;margin:auto;padding:clamp(1rem,4vw,3rem)}
a{color:#9feee1}h1{font-size:clamp(2rem,6vw,4rem);margin:.4em 0}
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(14rem,1fr);gap:2rem;align-items:start}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;box-shadow:0 0 0 1px #38534e}
button,select{font:inherit;padding:.55rem;background:#192c34;color:inherit;border:1px solid #567a78}
button{cursor:pointer}button[aria-pressed=true]{background:#285953}
.controls{display:grid;grid-template-columns:repeat(3,3rem);gap:.25rem;margin-block:1rem}
.controls button:first-child{grid-column:2}.controls button:nth-child(2){grid-column:1}
aside{border-top:1px solid #38534e}fieldset{border:1px solid #38534e;margin:1rem 0;padding:.75rem}
fieldset button{margin:.35rem .2rem .1rem 0}small{color:#b4cdc7}
@media(max-width:44rem){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<a href="../">← Block Topia</a>
<h1>Lumina’s Waterfront</h1>
<div class="layout">
<canvas id="map" width="384" height="384" role="img" aria-label="Waterfront map with streets, a dock, lighthouse, workshop and harbor cottages"></canvas>
<aside>
<h2>Explore the harbor</h2>
<p>Use the arrow keys, WASD or the buttons to walk the streets and dock.</p>
<div class="controls" aria-label="Movement">
<button type="button" data-move="up" aria-label="Walk north">↑</button>
<button type="button" data-move="left" aria-label="Walk west">←</button>
<button type="button" data-move="down" aria-label="Walk south">↓</button>
<button type="button" data-move="right" aria-label="Walk east">→</button>
</div>
<p id="location"></p>
<fieldset>
<legend>Edit your map</legend>
<button id="edit" type="button" aria-pressed="false">Edit tiles</button>
<label for="tile">Tile</label>
<select id="tile"></select>
<p><small>Turn on Edit tiles, then select a square on the map. Edits save in this browser. Download the layout to share it.</small></p>
<button id="download" type="button">Download map</button>
<button id="reset" type="button">Reset map</button>
<p id="status" role="status"></p>
</fieldset>
</aside>
</div>
</main>
<script>
"use strict";
const initial = [
  "~~~~d~~~~~~~",
  "~~~~d~~~~~~~",
  "...rr.......",
  "...hrw...~..",
  "....r.......",
  "....rc......",
  "..rrrrrrrr..",
  "..r...c..r..",
  "..rw.....r..",
  "..rrrrrrrr..",
  "......r.....",
  "......r....."
];
const tiles = {
  "~": ["Water", "#17465d"], ".": ["Ground", "#35554a"],
  r: ["Street", "#657e87"], d: ["Dock", "#ac865d"],
  h: ["Lighthouse", "#e6cc98"], w: ["Workshop", "#bf8454"],
  c: ["Harbor cottage", "#a86060"]
};
const directions = { up: [0,-1], left: [-1,0], down: [0,1], right: [1,0] };
const keys = { arrowup:"up", arrowleft:"left", arrowdown:"down", arrowright:"right", w:"up", a:"left", s:"down", d:"right" };
const storageKey = "block-topia.waterfront.v1";
const spawn = { x: 4, y: 6 };
const canvas = document.querySelector("#map");
const ctx = canvas.getContext("2d");
const edit = document.querySelector("#edit");
const select = document.querySelector("#tile");
const status = document.querySelector("#status");
const locationLabel = document.querySelector("#location");
let rows = [...initial];
let player = { ...spawn };
let editing = false;

function walkable(tile) {
  return tile === "r" || tile === "d";
}

try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (Array.isArray(saved) && saved.length === 12 &&
      saved.every(row => typeof row === "string" && row.length === 12 && [...row].every(tile => Object.hasOwn(tiles, tile))) &&
      walkable(saved[spawn.y][spawn.x])) rows = saved;
} catch {
  status.textContent = "The saved layout could not be loaded.";
}

for (const [tile, [name]] of Object.entries(tiles)) {
  select.add(new Option(name, tile));
}
select.value = "r";

function draw() {
  rows.forEach((row, y) => [...row].forEach((tile, x) => {
    const left = x * 32;
    const top = y * 32;
    ctx.fillStyle = tiles[tile][1];
    ctx.fillRect(left, top, 32, 32);
    if (tile === "~" || tile === "d" || tile === "r") {
      ctx.fillStyle = tile === "~" ? "#27627a" : "#ffffff24";
      ctx.fillRect(left + 5, top + 14, 22, 2);
    }
    if ("hwc".includes(tile)) {
      ctx.fillStyle = "#263139";
      ctx.fillRect(left+4, top+5, 24, 23);
      ctx.fillStyle = tiles[tile][1];
      ctx.fillRect(left+6, top+7, 20, 12);
      ctx.fillStyle = "#ffe6aa";
      ctx.fillRect(left+13, top+20, 6, 6);
    }
  }));
  ctx.fillStyle = "#10212b";
  ctx.fillRect(player.x*32+8, player.y*32+8, 16, 16);
  ctx.fillStyle = "#8fffe7";
  ctx.fillRect(player.x*32+11, player.y*32+11, 10, 10);
  locationLabel.textContent = tiles[rows[player.y][player.x]][0] + " · " + (player.x+1) + ", " + (player.y+1);
}

function move(direction) {
  const [dx, dy] = directions[direction];
  const x = player.x + dx;
  const y = player.y + dy;
  if (!walkable(rows[y]?.[x])) return;
  player = { x, y };
  draw();
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(rows));
    status.textContent = "Saved in this browser.";
  } catch {
    status.textContent = "Browser storage is unavailable. Download the map to keep your edits.";
  }
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  if (!Object.hasOwn(keys, key) || event.ctrlKey || event.metaKey || event.altKey ||
      event.target.closest("button, select, input, textarea, [contenteditable]")) return;
  event.preventDefault();
  move(keys[key]);
});
document.querySelectorAll("[data-move]").forEach(button => {
  button.addEventListener("click", () => move(button.dataset.move));
});
edit.addEventListener("click", () => {
  editing = !editing;
  edit.setAttribute("aria-pressed", String(editing));
  status.textContent = editing ? "Select a square to place a tile." : "Tile editing is off.";
});
canvas.addEventListener("click", event => {
  if (!editing) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((event.clientX - rect.left) * 12 / rect.width);
  const y = Math.floor((event.clientY - rect.top) * 12 / rect.height);
  if (x < 0 || x >= 12 || y < 0 || y >= 12) return;
  if (x === spawn.x && y === spawn.y && !walkable(select.value)) {
    status.textContent = "Keep the starting square walkable.";
    return;
  }
  rows[y] = rows[y].slice(0, x) + select.value + rows[y].slice(x+1);
  if (!walkable(rows[player.y][player.x])) player = { ...spawn };
  save();
  draw();
});
document.querySelector("#download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify({ name: "Lumina’s Waterfront", rows }, null, 2)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "luminas-waterfront.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.querySelector("#reset").addEventListener("click", () => {
  if (!window.confirm("Reset your browser’s map to the original layout?")) return;
  rows = [...initial];
  player = { ...spawn };
  save();
  draw();
});
draw();
</script>
</body>
</html>
