<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina’s Waterfront | Block Topia</title>
<style>
:root{color-scheme:dark;background:#13131c;color:#f5edf5;font:1rem system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0}
a{color:#91efe3}header,.tools{padding-inline:clamp(1rem,3vw,3rem)}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem 1.5rem;padding-block:.85rem}
h1{margin:0;font:600 clamp(1.45rem,3vw,2.65rem) system-ui,sans-serif;letter-spacing:-.04em}
.viewport{position:relative;background:#101f34;border-block:1px solid #494455}
.map-scroll{overflow-x:auto;overscroll-behavior-inline:contain}
canvas{display:block;width:100%;min-width:740px;height:auto;image-rendering:pixelated;cursor:pointer}
canvas[data-editing=true]{cursor:crosshair}
#location{position:absolute;inset:auto auto .55rem .65rem;margin:0;padding:.35rem .65rem;background:#101a20ed;color:#e4f5e7;border:1px solid #668680;pointer-events:none;font-size:.85rem}
.tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem 2rem;padding-block:.75rem}
.movement{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem}
.movement p,#status{margin:0;font-size:.85rem;color:#c1d4cc}
button,select{font:inherit;min-height:44px;padding:.45rem .65rem;background:#1b2d33;color:inherit;border:1px solid #658782;border-radius:.25rem}
button,summary{cursor:pointer}button[aria-pressed=true]{background:#356858}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #ffdd90;outline-offset:3px}
details{padding:.35rem 0}
fieldset{border:0;padding:0;margin:.65rem 0 0;min-inline-size:0}
fieldset p{max-width:42rem;margin:.4rem 0}
fieldset button{margin:.2rem .15rem .2rem 0}
@media(min-width:740px){.pan-help{display:none}}
</style>
</head>
<body>
<main>
<header>
<h1>Lumina’s Waterfront</h1>
<a href="../">← Block Topia</a>
</header>
<div class="viewport">
<div class="map-scroll">
<canvas id="map" width="896" height="384" role="img" aria-describedby="movement-help" aria-label="Nighttime waterfront map with docks, a lighthouse, warehouses, graffiti walls and record shops"></canvas>
</div>
<p id="location"></p>
</div>
<div class="tools">
<section class="movement" aria-label="Explore the harbor">
<p id="movement-help">Click or tap a street, footpath, or dock to walk there. <span class="pan-help">Swipe sideways to see the whole harbor.</span></p>
</section>
<details id="editor">
<summary>Map editor</summary>
<fieldset aria-label="Edit your map">
<button id="edit" type="button" aria-pressed="false">Edit tiles</button>
<label for="tile">Tile</label>
<select id="tile"></select>
<p><small>Turn on Edit tiles, then select a square inside the highlighted district. Edits save in this browser. Download the layout to share it.</small></p>
<button id="download" type="button">Download map</button>
<button id="reset" type="button">Reset map</button>
<p id="status" role="status"></p>
</fieldset>
</details>
</div>
</main>
<script src="district.js?v=6"></script>
<script src="harbor-art.js?v=8"></script>
<script>
"use strict";
const district = window.waterfrontDistrict;
const { rows: initial, spawn, tiles, tileSize } = district;
const columns = initial[0].length;
const mapWidth = columns * tileSize;
const mapHeight = initial.length * tileSize;
const directions = { up: [0,-1], left: [-1,0], down: [0,1], right: [1,0] };
const storageKey = "block-topia.waterfront.v3";
const previousStorageKey = "block-topia.waterfront.v2";
const legacyStorageKey = "block-topia.waterfront.v1";
const mapScroll = document.querySelector(".map-scroll");
const canvas = document.querySelector("#map");
const ctx = canvas.getContext("2d");
const edit = document.querySelector("#edit");
const select = document.querySelector("#tile");
const status = document.querySelector("#status");
const locationLabel = document.querySelector("#location");
let rows = [...initial];
let player = { ...spawn };
let editing = false;
let walkTimer;

function walkable(tile) {
  return Boolean(tiles[tile]?.walkable);
}

function validLayout(candidate, baseline, startX) {
  return Array.isArray(candidate) && candidate.length === baseline.length &&
    candidate.every((row, y) => typeof row === "string" && row.length === baseline[y].length &&
      [...row].every(tile => Object.hasOwn(tiles, tile))) &&
    walkable(candidate[spawn.y][startX]);
}

function restoreLayout() {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (validLayout(saved, initial, spawn.x)) return saved;

  const wide = JSON.parse(localStorage.getItem(previousStorageKey));
  if (validLayout(wide, district.previousWideRows, spawn.x)) {
    return applyEdits(wide, district.previousWideRows, 0);
  }
  const { rows: previous, columnOffset } = district.previousLayout;
  const legacy = JSON.parse(localStorage.getItem(legacyStorageKey));
  if (!validLayout(legacy, previous, spawn.x - columnOffset)) return [...initial];
  return applyEdits(legacy, previous, columnOffset);
}

function applyEdits(legacy, previous, columnOffset) {

  // Carry over player edits while keeping the new street connections in untouched tiles.
  return initial.map((row, y) => [...row].map((tile, x) => {
    const oldX = x - columnOffset;
    const edited = legacy[y][oldX];
    return edited !== undefined && edited !== previous[y][oldX] ? edited : tile;
  }).join(""));
}

try {
  rows = restoreLayout();
} catch {
  status.textContent = "The saved layout could not be loaded.";
}

for (const [tile, { name }] of Object.entries(tiles)) {
  select.add(new Option(name, tile));
}
select.value = "r";

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let sceneTime = null;

function paintMap() {
  window.drawWaterfront(ctx, rows, player, district, sceneTime);
  if (editing) {
    ctx.strokeStyle = "#fce5a2";
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, mapWidth - 2, mapHeight - 2);
  }
}

function draw() {
  paintMap();
  locationLabel.textContent = tiles[rows[player.y][player.x]].name + " · " + (player.x + 1) + ", " + (player.y + 1);
}

function findRoute(start, goal, canWalk) {
  const queue = [{ ...start, previous: null }];
  const seen = new Set([start.x + "," + start.y]);
  for (const step of queue) {
    if (step.x === goal.x && step.y === goal.y) {
      const route = [];
      for (let node = step; node.previous; node = node.previous) route.push(node);
      return route.reverse();
    }
    for (const [dx, dy] of Object.values(directions)) {
      const x = step.x + dx;
      const y = step.y + dy;
      const key = x + "," + y;
      if (!seen.has(key) && canWalk(x, y)) {
        seen.add(key);
        queue.push({ x, y, previous: step });
      }
    }
  }
  return null;
}

function walkTo(x, y) {
  clearTimeout(walkTimer);
  const route = findRoute(player, { x, y }, (col, row) => walkable(rows[row]?.[col]));
  if (!route) {
    draw();
    locationLabel.textContent += " · No walking route";
    return;
  }
  function advance(index) {
    const step = route[index];
    if (!step) return;
    player = { x: step.x, y: step.y };
    draw();
    if (index + 1 < route.length) walkTimer = setTimeout(() => advance(index + 1), 120);
  }
  draw();
  advance(0);
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(rows));
    status.textContent = "Saved in this browser.";
  } catch {
    status.textContent = "Browser storage is unavailable. Download the map to keep your edits.";
  }
}

function setEditing(enabled) {
  clearTimeout(walkTimer);
  editing = enabled;
  canvas.dataset.editing = String(editing);
  edit.setAttribute("aria-pressed", String(editing));
  status.textContent = editing ? "Select a square to place a tile." : "Tile editing is off.";
  draw();
}
edit.addEventListener("click", () => setEditing(!editing));
document.querySelector("#editor").addEventListener("toggle", event => {
  if (!event.currentTarget.open && editing) setEditing(false);
});
canvas.addEventListener("click", event => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((event.clientX - rect.left) * mapWidth / rect.width / tileSize);
  const y = Math.floor((event.clientY - rect.top) * mapHeight / rect.height / tileSize);
  if (x < 0 || x >= columns || y < 0 || y >= initial.length) return;
  if (!editing) {
    walkTo(x, y);
    return;
  }
  if (x === spawn.x && y === spawn.y && !walkable(select.value)) {
    status.textContent = "Keep the starting square walkable.";
    return;
  }
  rows[y] = rows[y].slice(0, x) + select.value + rows[y].slice(x+1);
  if (!walkable(rows[player.y][player.x])) player = { ...spawn };
  save();
  draw();
});
document.querySelector("#download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify({ name: district.name, rows }, null, 2)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "luminas-waterfront.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.querySelector("#reset").addEventListener("click", () => {
  if (!window.confirm("Reset your browser’s map to the original layout?")) return;
  clearTimeout(walkTimer);
  rows = [...initial];
  player = { ...spawn };
  save();
  draw();
});
const renderScale = 2;
canvas.width = mapWidth * renderScale;
canvas.height = mapHeight * renderScale;
ctx.scale(renderScale, renderScale);
ctx.imageSmoothingEnabled = false;
const spawnCenter = (spawn.x + 0.5) * canvas.clientWidth / columns;
mapScroll.scrollLeft = Math.max(0, spawnCenter - mapScroll.clientWidth / 2);
draw();
window.loadWaterfrontSprites().then(paintMap);

let frameId;
function animateHarbor(now) {
  if (sceneTime === null || now / 1000 - sceneTime >= 1 / 18) {
    sceneTime = now / 1000;
    paintMap();
  }
  frameId = requestAnimationFrame(animateHarbor);
}

function syncAnimation() {
  cancelAnimationFrame(frameId);
  if (document.hidden || reducedMotion.matches) {
    sceneTime = null;
    paintMap();
    return;
  }
  frameId = requestAnimationFrame(animateHarbor);
}
document.addEventListener("visibilitychange", syncAnimation);
reducedMotion.addEventListener("change", syncAnimation);
syncAnimation();
</script>
</body>
</html>
