<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Quote</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/css/wax-quote-ui.css?v=2">
</head>
<body>
<main class="shell">
<h1>Pool Quote</h1>
<p class="muted">Display-only multi-source route estimate page.</p>
<section class="grid">
<div class="card">
<label>Amount<input id="amountIn" value="10" inputmode="decimal"></label>
<label>From<select id="tokenIn"></select></label>
<button id="switchTokens" type="button">Switch</button>
<label>To<select id="tokenOut"></select></label>
<label>DEX filter<select id="providerFilter"><option value="ALL" selected>All sources</option><option value="ALCOR">Alcor only</option><option value="TACO">Taco only</option><option value="NEFTY">Nefty only</option></select></label>
<label>Route type<select id="routeTypeFilter"><option value="ALL" selected>Best available</option><option value="direct">Direct only</option><option value="split">Split only</option><option value="multi-hop">Multi-hop only</option></select></label>
<label>Minimum score<select id="minLiquidity"><option value="0">Any</option><option value="10" selected>10+</option><option value="100">100+</option><option value="1000">1000+</option></select></label>
<label>Tolerance<select id="slippage"><option value="0.005">0.5%</option><option value="0.01" selected>1%</option><option value="0.02">2%</option></select></label>
<button id="quoteBtn" type="button">Refresh quote</button>
</div>
<aside id="resultPanel" class="card">Loading...</aside>
</section>
</main>
<script src="/js/wax-route-engine.js?v=2"></script>
<script src="/js/wax-quote-ui.js?v=2"></script>
</body>
</html>
