<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Sovereign Runtime Console</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--bg:#070d14;--panel:#0f1c2a;--line:#2d4a67;--text:#e9f6ff;--muted:#90b3d1;--accent:#52e3ff;--warn:#ffd166;--danger:#ff6b7a}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0,#11314f 0,transparent 40%),var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif;padding:14px}
    .grid{display:grid;gap:10px;grid-template-columns:1.2fr 1fr 1fr}.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,28,42,.96),rgba(9,16,24,.96));border-radius:12px;padding:10px}
    h1{margin:0 0 6px;color:var(--accent);font-size:1.2rem} h2{margin:0 0 8px;color:var(--accent);font-size:.95rem}
    .muted{color:var(--muted);font-size:.86rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stack{display:grid;gap:8px}
    label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:4px}
    input,select,textarea,button{width:100%;background:#08121c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
    textarea{min-height:72px;resize:vertical}button{cursor:pointer;background:linear-gradient(180deg,#7de9ff,#52e3ff);color:#061018;font-weight:700}
    button.warn{background:linear-gradient(180deg,#ffe08e,#ffd166)} button.danger{background:linear-gradient(180deg,#ff9ba6,#ff6b7a)}
    pre{margin:0;background:#02070d;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:230px;overflow:auto;font-size:12px;white-space:pre-wrap}
    .check{display:flex;align-items:center;gap:8px}.check input{width:auto}
    @media (max-width:1200px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <section class="panel" style="margin-bottom:10px">
    <h1>Hermes Sovereign Runtime Console</h1>
    <div class="muted">Real tool-using runtime. Chat requests route to actual repo/git/file/command tools with server-side gates.</div>
  </section>

  <main class="grid">
    <section class="panel stack">
      <h2>Chat Bridge</h2>
      <div class="row3">
        <div><label>Model</label><select id="model"></select></div>
        <div><label>Mode</label><select id="mode"><option value="chat">chat</option><option value="agent_edit">agent_edit</option><option value="admin">admin</option></select></div>
        <div><label>Role</label><select id="role"><option>main_hermes</option><option>ui_agent</option><option>runtime_agent</option><option>test_agent</option><option>deploy_agent</option><option>watcher_agent</option><option>npc_agent</option></select></div>
      </div>
      <div class="row">
        <div><label>Approval ID</label><input id="approvalId" placeholder="approval_xxx"></div>
        <div><label>Approval Token (HERMES_EDIT_TOKEN)</label><input id="approvalToken" type="password" placeholder="server edit token"></div>
      </div>
      <div class="check"><input id="confirmEdit" type="checkbox"><label for="confirmEdit" style="margin:0">confirmEdit=true</label></div>
      <div><label>System Prompt</label><textarea id="systemPrompt">You are Hermes. Use real backend tool results only.</textarea></div>
      <div><label>Prompt</label><textarea id="prompt"></textarea></div>
      <button id="sendChat">Run Chat</button>
      <pre id="chatLog"></pre>
    </section>

    <section class="panel stack">
      <h2>Action Plan</h2>
      <pre id="actionPlan"></pre>
      <h2>Tool Results</h2>
      <pre id="toolResults"></pre>
      <h2>Missing Requirements</h2>
      <pre id="missingRequirements"></pre>
    </section>

    <section class="panel stack">
      <h2>Direct Action</h2>
      <div><label>Action JSON</label><textarea id="actionJson">{"type":"file/list","payload":{"path":"."}}</textarea></div>
      <button id="runAction" class="warn">Run /api/hermes/action</button>
      <pre id="actionOutput"></pre>
    </section>
  </main>

  <script>
    window.HERMES_API_BASE_URL = window.HERMES_API_BASE_URL || "";
  </script>
  <script src="/js/hermes-chat.js"></script>
</body>
</html>
