  <style>
    :root { --wax-gold:#f3bd25; --wax-ink:#050607; }
    .wax-landing { background:var(--wax-ink); color:#fff; }
    .wax-landing * { box-sizing:border-box; }
    .wax-entry {
      display:grid; place-items:center; min-height:clamp(540px,75svh,850px);
      padding:clamp(56px,9vw,110px) 20px;
      background:radial-gradient(ellipse at 50% 20%,#14242a 0%,#080d10 48%,#050607 78%);
      text-align:center;
    }
    .wax-entry-inner { width:min(840px,100%); margin:0 auto; }
    .wax-entry-kicker { margin:0 0 24px; color:var(--wax-gold); font-size:clamp(.85rem,1.8vw,1rem); font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    .wax-entry h1 { margin:0 0 22px; color:#fff; font-size:clamp(2.6rem,7vw,5.8rem); font-weight:900; line-height:1.05; text-transform:uppercase; text-wrap:balance; overflow-wrap:break-word; }
    .wax-entry h1 span { color:var(--wax-gold); }
    .wax-entry-description { max-width:680px; margin:0 auto 36px; color:#d2dce0; font-size:clamp(1.1rem,2vw,1.35rem); line-height:1.65; }
    .wax-entry-button {
      display:inline-flex; align-items:center; justify-content:center; min-height:58px;
      max-width:100%; padding:17px 28px; border:2px solid var(--wax-gold);
      border-radius:4px; background:var(--wax-gold); color:#050607; font-size:clamp(.98rem,2vw,1.15rem);
      font-weight:900; letter-spacing:.025em; line-height:1.35; text-decoration:none; text-align:center; text-transform:uppercase;
    }
    .wax-entry-button:hover { background:#fff; border-color:#fff; color:#050607; }
    .wax-entry-button:focus-visible { outline:3px solid #fff; outline-offset:5px; }
    @media (max-width:600px) { .wax-entry { min-height:65svh; padding:48px 18px 68px; } .wax-entry-button { width:100%; } }
