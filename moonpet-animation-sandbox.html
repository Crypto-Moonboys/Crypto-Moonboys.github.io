<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moonpet Animation Sandbox</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="css/moonpet-animation-sandbox.css">
    <script src="js/moonpet-animation-sandbox.js" defer></script>
  </head>
  <body class="page-standalone-tool">
    <main class="sandbox-shell">
      <header class="sandbox-header">
        <div>
          <p class="eyebrow">Moonpet Art Factory</p>
          <h1>Animation Sandbox</h1>
        </div>
        <div class="status-strip" aria-label="Sandbox status summary">
          <span id="summary-approved">0 approved</span>
          <span id="summary-pending">0 pending</span>
          <span id="summary-rejected">0 rejected</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Animation sandbox controls">
        <label>
          <span>Status</span>
          <select id="status-filter">
            <option value="all">All</option>
            <option value="approved">Approved</option>
            <option value="pending">Pending review</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <label>
          <span>Speed</span>
          <input id="speed-control" type="range" min="4" max="24" value="12">
        </label>
        <button id="toggle-all" type="button">Pause All</button>
        <p id="manifest-source" class="manifest-source">Loading manifests...</p>
      </section>

      <section id="sandbox-grid" class="sandbox-grid" aria-live="polite"></section>

      <template id="asset-card-template">
        <article class="asset-card">
          <div class="preview-stage">
            <canvas width="256" height="256"></canvas>
            <span class="badge"></span>
          </div>
          <div class="asset-body">
            <div class="asset-title-row">
              <h2></h2>
              <button class="play-toggle" type="button">Pause</button>
            </div>
            <dl class="asset-meta"></dl>
            <p class="asset-note"></p>
          </div>
        </article>
      </template>
    </main>
  </body>
</html>
