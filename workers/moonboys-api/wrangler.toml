name = "moonboys-api"
main = "worker.js"
compatibility_date = "2026-04-12"
workers_dev = true
preview_urls = true

routes = [
  { pattern = "cryptomoonboys.com/api/waxonedge/*", zone_name = "cryptomoonboys.com" }
]

[triggers]
# Daily Telegram digest delivery at 09:00 UTC, five-minute Telegram checks,
# plus one-minute WaxOnEdge sync. WaxOnEdge 5m/15m/2h sub-cadences are computed in worker.js.
crons = ["* * * * *", "*/5 * * * *", "0 9 * * *"]

# Non-secret production defaults used by worker.js. These may be overridden
# in the Cloudflare dashboard if the deployed worker URLs change.
[vars]
TELEGRAM_BOT_USERNAME = "WIKICOMSBOT"
ANTI_CHEAT_WORKER_URL = "https://moonboys-anti-cheat.sercullen.workers.dev"
LEADERBOARD_API_URL = "https://moonboys-leaderboard.sercullen.workers.dev"
WAXONEDGE_FREE_SAFE_MODE = "false"

# D1 database binding — production wikicoms database.
[[d1_databases]]
binding = "DB"
database_name = "wikicoms"
database_id = "8a36e17a-18fa-4b98-90e1-3f269164b166"
migrations_dir = "migrations"

# ── Telegram secrets ──────────────────────────────────────────────────────────
# Required for POST /telegram/auth and POST /telegram/webhook.
# Set via Wrangler CLI — never commit values to source control:
#
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_BOT_USERNAME
#   wrangler secret put ADMIN_TELEGRAM_IDS
#   wrangler secret put ADMIN_SECRET
#   wrangler secret put TELEGRAM_GROUP_CHAT_ID
#   wrangler secret put TELEGRAM_GROUP_THREAD_ID   # optional topic/thread
#
# TELEGRAM_BOT_TOKEN    — The bot token from BotFather (used for HMAC verification).
# TELEGRAM_BOT_USERNAME — The bot @username (kept for runtime/dashboard consistency).
# ADMIN_TELEGRAM_IDS    — CSV of Telegram user IDs authorised to run admin bot commands.
# ADMIN_SECRET             — Shared secret forwarded as X-Admin-Secret to the anti-cheat worker.
# TELEGRAM_GROUP_CHAT_ID   — Main Telegram group chat ID for group announcements.
# TELEGRAM_GROUP_THREAD_ID — Optional Telegram topic/thread ID for group announcements.
#
# BotFather setup:
#   /setdomain   → set to:  moonboys-api.sercullen.workers.dev
#   Webhook URL  → POST https://moonboys-api.sercullen.workers.dev/telegram/webhook
#   Auth URL     → https://moonboys-api.sercullen.workers.dev/telegram/auth

# ── Anti-cheat admin secrets ──────────────────────────────────────────────────
# Required for /gkban, /gkunban, /gkrisk, /gkclearstrikes bot commands and for
# the GET /telegram/user/status route to read telegram_anticheat_state from D1.
# Set secrets via Wrangler CLI — never commit secret values to source control.
# ADMIN_SECRET must match the moonboys-anti-cheat worker's ADMIN_SECRET.
#
# ANTI_CHEAT_WORKER_URL is a non-secret var above.
# LEADERBOARD_API_URL is a non-secret var above.

# ── SWARMSY public NPC bridge secret ─────────────────────────────────────────
# Required for POST /public/npc-chat (Sparky live chat bridge).
# Set via Wrangler CLI — never commit the token value to source control:
#
#   wrangler secret put SWARMSY_BRIDGE_TOKEN
#
# SWARMSY_BRIDGE_TOKEN — ****** forwarded as X-SWARMSY-BRIDGE-TOKEN to
#   https://swarmsy.cryptomoonboys.com/api/swarmsy/public/npc-chat.
#   The token is never exposed in HTTP responses or Worker source code.
#   If the secret is absent the route returns 503 { success:false, error:"npc_bridge_not_configured" }.
