<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAXCASH analytics powered by indexed WaxOnEdge market data.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="WAXCASH Analytics | Crypto Moonboys">
  <meta property="og:description" content="Read-only WAXCASH token stats, price proof, liquidity, volume, supply, market cap, pair table, and indexed chart data.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cryptomoonboys.com/waxcash.html">
  <meta property="og:image" content="https://cryptomoonboys.com/img/CRYPTO-MOONBOYS-BITCOIN-LOGO.png">
  <link rel="canonical" href="https://cryptomoonboys.com/waxcash.html">
  <title>WAXCASH Analytics | Crypto Moonboys</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111820;
      --panel: #171e27;
      --panel-2: #202a35;
      --line: #344252;
      --text: #f3f7fb;
      --muted: #94a3ad;
      --cyan: #04f0e6;
      --green: #00f59f;
      --red: #ff3d67;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { padding: 24px; }
    .wx-shell { max-width: 1840px; margin: 0 auto; }
    .wx-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
      margin-bottom: 18px;
    }
    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: clamp(30px, 4vw, 56px); color: var(--cyan); line-height: 1; }
    h2 { font-size: 20px; color: var(--cyan); }
    .wx-subtitle { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .wx-status { color: var(--muted); font-size: 14px; text-align: right; }
    .wx-grid {
      display: grid;
      grid-template-columns: minmax(300px, 540px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .wx-panel {
      background: linear-gradient(180deg, var(--panel), #121922);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .wx-panel-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .wx-stats { padding: 0; }
    .wx-row {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) minmax(150px, 1.6fr);
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.025);
      align-items: start;
    }
    .wx-row:nth-child(even) { background: rgba(255,255,255,0.075); }
    .wx-label { font-weight: 700; color: var(--text); }
    .wx-value { text-align: right; font-weight: 800; overflow-wrap: anywhere; line-height: 1.25; }
    .wx-value small { display: block; color: var(--green); font-size: 0.9em; line-height: 1.25; margin-top: 4px; }
    .wx-main-value { display: block; }
    .wx-reason {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      font-weight: 600;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }
    .wx-value .wx-reason,
    td .wx-reason {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      font-weight: 600;
    }
    .wx-muted { color: var(--muted); }
    .wx-positive { color: var(--green); }
    .wx-negative { color: var(--red); }
    .wx-warning { color: var(--gold); font-weight: 800; }
    .wx-chart {
      min-height: 360px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .wx-chart svg {
      width: 100%;
      height: 300px;
      background: #111722;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .wx-chart-empty {
      min-height: 300px;
      display: grid;
      place-items: center;
      background: #111722;
      border: 1px dashed var(--line);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }
    .wx-table-wrap { overflow-x: auto; max-width: 100%; }
    table { width: 100%; border-collapse: collapse; min-width: 1040px; table-layout: fixed; }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      text-align: right;
      vertical-align: top;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.3;
    }
    th:nth-child(1), td:nth-child(1) { width: 52px; }
    th:nth-child(2), td:nth-child(2) { width: 18%; }
    th:nth-child(3), td:nth-child(3) { width: 13%; }
    th:nth-child(4), td:nth-child(4) { width: 14%; }
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6) { width: 13%; }
    th:nth-child(7), td:nth-child(7) { width: 18%; }
    th:nth-child(8), td:nth-child(8) { width: 14%; }
    td small { display: block; margin-top: 4px; }
    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #121922;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) { text-align: left; }
    tbody tr:nth-child(odd) { background: rgba(255,255,255,0.025); }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.06); }
    .wx-token { color: var(--muted); font-weight: 700; }
    .wx-token strong { color: var(--text); display: block; }
    .wx-source { color: var(--cyan); font-weight: 800; }
    .wx-note { color: var(--muted); font-size: 13px; line-height: 1.45; }
    @media (max-width: 980px) {
      main { padding: 14px; }
      .wx-title { display: block; }
      .wx-status { text-align: left; margin-top: 10px; }
      .wx-grid { grid-template-columns: 1fr; }
      .wx-row { grid-template-columns: 1fr; }
      .wx-value { text-align: left; }
    }
  </style>
</head>
<body>
<main id="content" role="main">
  <div class="wx-shell">
    <header class="wx-title">
      <div>
        <h1>WAXCASH</h1>
        <p class="wx-subtitle">WaxOnEdge-style indexed analytics for graffitiking::WAXCASH</p>
      </div>
      <div id="wx-status" class="wx-status">Loading indexed analytics...</div>
    </header>

    <section class="wx-grid" aria-label="WAXCASH analytics">
      <article class="wx-panel">
        <div class="wx-panel-header">
          <h2>Token Stats</h2>
          <span id="wx-price-source" class="wx-note">--</span>
        </div>
        <div id="wx-stats" class="wx-stats" aria-live="polite"></div>
      </article>

      <article class="wx-panel">
        <div class="wx-panel-header">
          <h2>Chart</h2>
          <span id="wx-chart-source" class="wx-note">Indexed candles</span>
        </div>
        <div id="wx-chart" class="wx-chart" aria-live="polite"></div>
      </article>
    </section>

    <section class="wx-panel" style="margin-top:18px" aria-labelledby="wx-pairs-heading">
      <div class="wx-panel-header">
        <h2 id="wx-pairs-heading">WAXCASH Pairs</h2>
        <span id="wx-pair-summary" class="wx-note">--</span>
      </div>
      <div class="wx-table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Pair</th>
              <th>Source</th>
              <th>Status</th>
              <th>Liquidity</th>
              <th>Volume 24h</th>
              <th>Reserves</th>
              <th>Proof</th>
            </tr>
          </thead>
          <tbody id="wx-pairs">
            <tr><td colspan="8" class="wx-muted">Loading WAXCASH pairs...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script data-cfasync="false" src="/js/api-config.js"></script>

  var api = window.MOONBOYS_API || {};
  var info = api.getApiBaseInfo ? api.getApiBaseInfo({ allowProductionFallback: true }) : null;
  var baseUrl = String((info && info.url) || api.BASE_URL || api.PRODUCTION_BASE_URL || '').replace(/\/$/, '');
  if (!baseUrl || !window.fetch) return;

  window.fetch = function (input, init) {

    if (url && /^\/api\/waxonedge(?:\/|\?|$)/.test(url)) {
      var nextUrl = baseUrl + url;
      if (typeof input === 'string') return nativeFetch.call(this, nextUrl, init);
      try { return nativeFetch.call(this, new Request(nextUrl, input), init); }
      catch (_) { return nativeFetch.call(this, nextUrl, init); }
    }
    return nativeFetch.call(this, input, init);
  };

</script>
<script data-cfasync="false" src="/js/waxcash-analytics.js?v=wxcash-analytics-20260618-1"></script>
</body>
</html>
