<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAXCASH analytics powered by indexed WaxOnEdge market data.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="WAXCASH Analytics | Crypto Moonboys">
  <meta property="og:description" content="Old WaxOnEdge-style WAXCASH token stats, WAX candle chart, proof pool controls, and indexed pair details.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cryptomoonboys.com/waxcash.html">
  <meta property="og:image" content="https://cryptomoonboys.com/img/CRYPTO-MOONBOYS-BITCOIN-LOGO.png">
  <link rel="canonical" href="https://cryptomoonboys.com/waxcash.html">
  <title>WAXCASH Analytics | Crypto Moonboys</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111820;
      --rail: #0f141b;
      --panel: #151b23;
      --panel-2: #1c2631;
      --panel-3: #253241;
      --line: #344252;
      --text: #f5f7fb;
      --muted: #95a3ad;
      --cyan: #02f0e7;
      --green: #00f59f;
      --red: #ff3d67;
      --yellow: #f8c547;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { padding: 18px 16px 28px; }
    .wx-shell {
      max-width: 1868px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1a222c, #121922);
      border: 1px solid rgba(148,163,173,0.18);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.26);
    }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 30px; color: var(--cyan); line-height: 1; }
    h2 { font-size: 20px; color: var(--cyan); }
    h3 { font-size: 16px; color: var(--text); }
    .wx-note { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .wx-main-grid {
      display: grid;
      grid-template-columns: minmax(300px, 530px) minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }
    .wx-panel {
      background: var(--panel);
      border: 1px solid rgba(148,163,173,0.16);
      overflow: hidden;
    }
    .wx-stats-panel { border-radius: 0; }
    .wx-chart-panel { border-radius: 0; min-height: 800px; }
    .wx-panel-header {
      min-height: 50px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(148,163,173,0.16);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      background: #111722;
    }
    .wx-token-head {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: var(--rail);
      border-bottom: 1px solid rgba(148,163,173,0.16);
    }
    .wx-token-icon {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }
    .wx-token-name strong { display: block; font-size: 20px; }
    .wx-token-name span { display: block; color: var(--muted); font-weight: 700; }
    .wx-stats { padding: 0; }
    .wx-row {
      display: grid;
      grid-template-columns: minmax(128px, 1fr) minmax(146px, 1.45fr);
      gap: 12px;
      padding: 5px 0;
      min-height: 28px;
      align-items: center;
      background: var(--rail);
    }
    .wx-row:nth-child(4n+3),
    .wx-row:nth-child(4n+4) { background: var(--panel-3); }
    .wx-label {
      padding-left: 16px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .wx-value {
      padding-right: 16px;
      text-align: right;
      font-weight: 900;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }
    .wx-value small,
    .wx-subvalue {
      display: block;
      color: var(--green);
      font-size: 0.9em;
      line-height: 1.16;
      margin-top: 2px;
    }
    .wx-reason-dot {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      margin-left: 6px;
      border-radius: 50%;
      background: rgba(148,163,173,0.18);
      color: var(--muted);
      font-size: 10px;
      vertical-align: middle;
    }
    .wx-muted { color: var(--muted); }
    .wx-positive { color: var(--green); }
    .wx-negative { color: var(--red); }
    .wx-warning { color: var(--yellow); font-weight: 900; }
    .wx-chart-host {
      min-height: 660px;
      padding: 10px 14px 14px;
      position: relative;
    }
    .wx-external-chart-frame {
      width: 100%;
      height: 660px;
      min-height: 660px;
      background: #111722;
      border: 1px solid rgba(148,163,173,0.16);
    }
    .wx-chart-empty {
      min-height: 510px;
      display: grid;
      place-items: center;
      background: #111722;
      border: 1px dashed var(--line);
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }
    .wx-pairs-panel {
      margin-top: 10px;
      border-radius: 0;
    }
    .wx-table-wrap { overflow-x: auto; max-width: 100%; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1240px;
      table-layout: fixed;
      background: #121922;
    }
    th, td {
      padding: 7px 9px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      text-align: right;
      vertical-align: middle;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.08;
      font-weight: 800;
    }
    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #10161f;
    }
    .wx-sort-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 900;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }
    .wx-sort-button.is-active { color: var(--cyan); }
    th:nth-child(1), td:nth-child(1) { width: 58px; text-align: left; }
    th:nth-child(2), td:nth-child(2) { width: 12%; text-align: center; }
    th:nth-child(3), td:nth-child(3) { width: 15%; text-align: left; }
    th:nth-child(4), td:nth-child(4) { width: 14%; }
    th:nth-child(5), td:nth-child(5) { width: 13%; }
    th:nth-child(6), td:nth-child(6) { width: 13%; }
    th:nth-child(7), td:nth-child(7) { width: 14%; }
    th:nth-child(8), td:nth-child(8) { width: 14%; }
    th:nth-child(9), td:nth-child(9) { width: 14%; }
    tbody tr:nth-child(odd) { background: rgba(255,255,255,0.025); }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.06); }
    tbody tr.is-selected { outline: 2px solid rgba(2,240,231,0.42); outline-offset: -2px; }
    .wx-token {
      align-items: center;
      color: var(--muted);
      display: flex;
      font-weight: 800;
      gap: 7px;
      margin: 2px 0;
    }
    .wx-token-logo {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      display: block;
      flex: 0 0 auto;
      height: 24px;
      object-fit: contain;
      width: 24px;
    }
    .wx-token-text {
      display: block;
      min-width: 0;
    }
    .wx-token strong { color: var(--text); display: block; }
    .wx-pair-cell {
      align-items: flex-start;
      display: grid;
      gap: 7px;
      grid-template-columns: 44px minmax(0, 1fr);
    }
    .wx-fee-badge {
      color: var(--text);
      font-weight: 900;
      line-height: 1;
      margin-top: 2px;
      text-align: center;
      white-space: nowrap;
    }
    .wx-fee-icons {
      align-items: center;
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
      min-height: 24px;
    }
    .wx-fee-icons .wx-token-logo {
      margin-left: -6px;
    }
    .wx-fee-icons .wx-token-logo:first-child {
      margin-left: 0;
    }
    .wx-source-cell {
      align-items: center;
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      min-width: 58px;
    }
    .wx-source-logo {
      aspect-ratio: 1;
      display: block;
      height: 34px;
      object-fit: contain;
      width: 34px;
    }
    .wx-source-name { color: var(--text); font-weight: 900; }
    .wx-cell-sub { display: block; color: var(--green); margin-top: 2px; }
    @media (max-width: 980px) {
      main { padding: 10px; }
      .wx-shell { padding: 12px; border-radius: 10px; }
      .wx-main-grid { grid-template-columns: 1fr; }
      .wx-chart-panel { min-height: 620px; }
      .wx-external-chart-frame, .wx-chart-empty { height: 520px; min-height: 520px; }
    }
  </style>
</head>
<body>
<main id="content" role="main">
  <div class="wx-shell">
    <div id="wx-status" hidden></div>

    <section class="wx-main-grid" aria-label="WAXCASH analytics">
      <article class="wx-panel wx-stats-panel">
        <div class="wx-panel-header">
          <h2>Token stats</h2>
        </div>
        <div class="wx-token-head">
          <img id="wx-token-icon" class="wx-token-icon" alt="" src="/img/CRYPTO-MOONBOYS-BITCOIN-LOGO.png">
          <div class="wx-token-name">
            <strong>WAXCASH</strong>
            <span>graffitiking</span>
          </div>
        </div>
        <div id="wx-stats" class="wx-stats" aria-live="polite"></div>
      </article>

      <article class="wx-panel wx-chart-panel">
        <div class="wx-panel-header">
          <h2 id="wx-chart-heading">WAXCASH/WAX chart</h2>
        </div>
        <div id="wx-chart" class="wx-chart-host" aria-live="polite">
          <iframe class="wx-external-chart-frame" src="https://www.geckoterminal.com/wax/pools/swap-alcor-8388?embed=1" title="WAXCASH/WAX GeckoTerminal candle chart" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
        </div>
      </article>
    </section>

    <section class="wx-panel wx-pairs-panel" aria-labelledby="wx-pairs-heading">
      <div class="wx-panel-header">
        <h2 id="wx-pairs-heading">Pair details</h2>
        <span id="wx-pair-summary" class="wx-note">--</span>
      </div>
      <div class="wx-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Exchange</th>
              <th>Pair</th>
              <th><button id="wx-sort-liquidity" class="wx-sort-button" type="button" data-sort="liquidity">Liquidity</button></th>
              <th>Price</th>
              <th>24h price change</th>
              <th><button id="wx-sort-volume24" class="wx-sort-button" type="button" data-sort="volume24">24h volume</button></th>
              <th>7d volume</th>
              <th>30d volume</th>
            </tr>
          </thead>
          <tbody id="wx-pairs">
            <tr><td colspan="9" class="wx-muted">Loading WAXCASH pairs...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script data-cfasync="false" src="/js/api-config.js"></script>
<script data-cfasync="false">

  'use strict';

      if (typeof input === 'string') return nativeFetch.call(this, nextUrl, init);
      try { return nativeFetch.call(this, new Request(nextUrl, input), init); }
      catch (_) { return nativeFetch.call(this, nextUrl, init); }

</body>
</html>
