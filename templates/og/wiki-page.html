<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Crypto Moonboys Wiki</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/wiki.css">
  <link rel="stylesheet" href="/css/battle-layer.css">
  <link rel="stylesheet" href="/css/wiki-template-comments.css">
</head>
<body class="page-wiki page-standard-shell page-wiki-template-comments">
  <main id="content" role="main">
    <article class="wiki-content og-page-template og-page-template--wiki" data-page-type="wiki_article" data-page-id="{{SLUG}}" data-battle-layout="dashboard" data-battle-kicker="About This Page" data-battle-subtitle="{{PRIMARY_CATEGORY}}">
      <header class="wiki-hero">
        <p class="wiki-hero-breadcrumb">Crypto Moonboys Wiki</p>
        <h1>{{TITLE}}</h1>
        <p>{{SUMMARY}}</p>
      </header>

      <div class="article-meta">
        <span class="tag">{{PRIMARY_CATEGORY}}</span>
        <span class="tag">Updated {{UPDATED_DATE}}</span>
      </div>

      <template class="nft-battle-media-template" data-battle-media="nft" data-page-id="{{SLUG}}">
        <figure class="battle-page-media wiki-page-media-card">
          <img class="wiki-hero-image" src="{{OG_IMAGE}}" alt="{{TITLE}} page artwork" loading="lazy" decoding="async">
        </figure>
      </template>

      <section class="wiki-section">
        <h2 id="overview">Overview</h2>
        {{BODY}}
      </section>

      <section class="wiki-section related-wiki-paths" aria-labelledby="related-paths-title">
        <h2 id="related-paths-title">Related Wiki Paths</h2>
        {{RELATED_PATHS}}
      </section>

      <section class="wiki-section">
        <h2 id="sources">Sources</h2>
        <ul class="sources-list">{{SOURCES}}</ul>
      </section>
    </article>

    <div class="wiki-comments" data-page-id="{{SLUG}}"></div>
  </main>

  <script data-cfasync="false" src="/js/api-config.js"></script>
  <script data-cfasync="false" src="/js/arcade/core/global-event-bus.js"></script>
  <script data-cfasync="false" src="/js/identity-gate.js"></script>
  <script data-cfasync="false" src="/js/core/moonboys-state.js"></script>
  <script data-cfasync="false" src="/js/core/daily-loop-state.js"></script>
  <script data-cfasync="false" src="/js/site-shell.js"></script>
  <script data-cfasync="false" src="/js/components/connection-status-panel.js"></script>
  <script data-cfasync="false" src="/js/components/global-player-header.js"></script>
  <script data-cfasync="false" src="/js/components/live-activity-summary.js"></script>
  <script data-cfasync="false" src="/js/faction-alignment.js"></script>
  <script data-cfasync="false" src="/js/wiki.js"></script>
  <script data-cfasync="false" src="/js/bible-loader.js"></script>
  <script data-cfasync="false" src="/js/engagement.js"></script>
  <script data-cfasync="false" src="/js/comments.js"></script>
  <script data-cfasync="false" src="/js/wiki-live-contributors.js"></script>
  <script data-cfasync="false" src="/js/wiki-template-dashboard.js"></script>
  <script data-cfasync="false" src="/js/battle-layer.js"></script>
</body>
</html>
